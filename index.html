<style>
:root {
  --paper:#F1F4F2; --surface:#FFFFFF;
  --ink:#16231F; --ink-soft:#5B6D66; --ink-faint:#8B9A94;
  --rule:#D8E0DC; --well:#FAFCFB; --track:#E7ECE9;
  --bills:#3E5750; --debt:#A6432F; --life:#C08A2E; --free:#2E8B6B; --short:#8C1D12;
  --alarm-bg:#FBEFEC; --alarm-ink:#5E1A11;
  --inc1:#C08A2E; --inc2:#3E6E8E; --inc3:#7D5BA6; --inc4:#4F7A4A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#101815; --surface:#16211D;
    --ink:#E4EAE7; --ink-soft:#9AAAA4; --ink-faint:#6E827B;
    --rule:#263430; --well:#0D1411; --track:#22302B;
    --bills:#7E9A92; --debt:#D9705A; --life:#E0A94A; --free:#4FBF92; --short:#E06A56;
    --alarm-bg:#2A1713; --alarm-ink:#F0C4BA;
    --inc1:#E0A94A; --inc2:#6FA3C4; --inc3:#B292D6; --inc4:#7FB07A;
  }
}
:root[data-theme="dark"] {
  --paper:#101815; --surface:#16211D;
  --ink:#E4EAE7; --ink-soft:#9AAAA4; --ink-faint:#6E827B;
  --rule:#263430; --well:#0D1411; --track:#22302B;
  --bills:#7E9A92; --debt:#D9705A; --life:#E0A94A; --free:#4FBF92; --short:#E06A56;
  --alarm-bg:#2A1713; --alarm-ink:#F0C4BA;
  --inc1:#E0A94A; --inc2:#6FA3C4; --inc3:#B292D6; --inc4:#7FB07A;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  background:var(--paper); color:var(--ink); min-height:100vh;
  padding-bottom:calc(56px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}
main { max-width:560px; margin:0 auto; padding:16px 14px 0; }

.head { position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top); }
.head-top { max-width:560px; margin:0 auto; padding:12px 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand { display:flex; align-items:center; gap:8px; }
.brand-mark { width:10px; height:18px; border-radius:1px;
  background:linear-gradient(to bottom,var(--bills) 33%,var(--life) 33%,var(--life) 66%,var(--free) 66%); }
.brand-name { font-weight:600; font-size:15px; letter-spacing:-.01em; }
.status { font-size:11px; color:var(--ink-faint); text-align:right; white-space:nowrap; }
.head-right { display:flex; align-items:center; gap:8px; flex:none; }
button.ghost { font:inherit; font-size:12px; font-weight:500; background:none;
  border:1px solid var(--rule); color:var(--ink-soft); padding:6px 10px;
  border-radius:4px; cursor:pointer; flex:none; }
body.hushed input[inputmode="decimal"], body.hushed input[inputmode="numeric"] {
  -webkit-text-security:disc; text-security:disc; }
.status.bad { color:var(--short); font-weight:600; }
.tabs { max-width:560px; margin:0 auto; display:flex; gap:2px; padding:0 8px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { font:inherit; font-size:14px; font-weight:500; background:none; border:none; cursor:pointer;
  color:var(--ink-faint); padding:8px 10px 10px; border-bottom:2px solid transparent; white-space:nowrap; }
.tab.on { color:var(--ink); border-bottom-color:var(--ink); }
:focus-visible { outline:2px solid var(--free); outline-offset:2px; }

.hero { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:20px 16px 16px; margin-bottom:14px; }
.hero-when { font-size:12px; color:var(--ink-soft); font-weight:500; }
.hero-amt { font-size:40px; font-weight:700; letter-spacing:-.03em; line-height:1.05; margin:4px 0 2px; }
.hero-note { font-size:12px; color:var(--ink-faint); margin-bottom:16px; }
.bar { display:flex; height:12px; border-radius:2px; overflow:hidden; background:var(--track); gap:1px; }
.bar-seg { min-width:2px; }
.legend { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:14px; }
.legend-item { display:flex; align-items:center; gap:6px; font-size:12px; }
.dot { width:7px; height:7px; border-radius:2px; flex:none; }
.legend-label { color:var(--ink-soft); }
.legend-val { margin-left:auto; font-weight:600; }
.alarm { margin-top:14px; padding:10px 12px; background:var(--alarm-bg); border-left:3px solid var(--short);
  border-radius:0 4px 4px 0; font-size:13px; line-height:1.5; color:var(--alarm-ink); }

.card { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:16px; margin-bottom:14px; }
.card.quiet { background:none; border:none; padding:0; }
.card h2 { font-size:15px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
.card h3 { font-size:13px; font-weight:600; color:var(--ink-soft); margin:20px 0 6px; padding-bottom:6px; border-bottom:1px solid var(--rule); }
.muted { font-size:13px; line-height:1.55; color:var(--ink-soft); margin:0 0 12px; }
.muted.foot { margin:10px 0 0; font-size:12px; color:var(--ink-faint); }
.empty { background:var(--surface); border:1px dashed var(--rule); border-radius:6px; padding:24px 18px;
  font-size:13px; line-height:1.55; color:var(--ink-soft); text-align:center; }

.line { display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--rule); font-size:14px; }
.line:last-child { border-bottom:none; }
.line-name { flex:1; min-width:0; }
.line-when { font-size:11px; color:var(--ink-faint); white-space:nowrap; }
.line-amt { font-weight:600; white-space:nowrap; }
.line.total { border-bottom:none; border-top:2px solid var(--ink); margin-top:4px; padding-top:10px; font-weight:600; }

.row { display:flex; align-items:center; gap:6px; padding:5px 0; }
.row-body { flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
.row label { flex:1; font-size:14px; color:var(--ink-soft); }
.block { padding:10px 0; border-bottom:1px solid var(--rule); }
.block:last-of-type { border-bottom:none; }
input, select { font:inherit; font-size:16px; font-variant-numeric:tabular-nums; background:var(--well);
  border:1px solid var(--rule); border-radius:4px; color:var(--ink); padding:8px 9px; min-width:0; }
input:focus, select:focus { outline:none; border-color:var(--ink-soft); background:var(--surface); }
input.text { flex:1; font-size:15px; }
input.day { width:48px; text-align:center; }
select.sel, input.date { flex:1; font-size:15px; }
.mi { position:relative; display:flex; align-items:center; width:110px; flex:none; }
.mi-sign { position:absolute; left:9px; font-size:13px; color:var(--ink-faint); pointer-events:none; }
.mi input { width:100%; padding-left:20px; font-weight:600; text-align:right; }
.pct { position:relative; display:flex; align-items:center; width:70px; flex:none; }
.pct input { width:100%; text-align:right; padding-right:20px; }
.pct-sign { position:absolute; right:8px; font-size:13px; color:var(--ink-faint); }
.del { font:inherit; font-size:22px; line-height:1; background:none; border:none; color:var(--ink-faint);
  cursor:pointer; padding:4px 8px; flex:none; }
.add { font:inherit; font-size:13px; font-weight:500; background:none; border:1px dashed var(--rule);
  border-radius:4px; color:var(--ink-soft); padding:11px; width:100%; cursor:pointer; margin-top:8px; }
.action { font:inherit; font-size:14px; font-weight:500; background:var(--well); border:1px solid var(--rule);
  border-radius:4px; color:var(--ink); padding:12px; width:100%; cursor:pointer; margin-bottom:8px; }
.action:hover { border-color:var(--ink-soft); }

.tl-row { display:flex; align-items:center; gap:10px; padding:3px 0; border-bottom:1px solid var(--rule); }
.tl-row:last-child { border-bottom:none; }
.tl-date { width:86px; font-size:13px; color:var(--ink-soft); flex:none; display:flex; align-items:center; gap:5px; }
.tl-in { flex:1; display:flex; }
.tl-multi { font-size:14px; font-weight:600; padding:8px 0; }
.tl-out { width:72px; text-align:right; font-size:14px; font-weight:600; flex:none; }
.tl-in { min-width:0; }
.tl-in .mi { width:96px; }

.cat { border:1px solid var(--rule); border-radius:6px; margin-bottom:9px; overflow:hidden; }
.cat-head { display:flex; align-items:center; gap:9px; width:100%; padding:12px 13px;
  background:var(--well); border:none; font:inherit; text-align:left; cursor:pointer; color:var(--ink); }
.cat-name { font-size:14px; font-weight:600; flex:1; min-width:0; overflow-wrap:anywhere; }
.cat-sum { font-size:11px; color:var(--ink-faint); text-align:right; white-space:nowrap; }
.cat-sum b { display:block; font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums; }
.cat-chev { font-size:15px; color:var(--ink-faint); flex:none; transition:transform .15s ease; }
.cat-chev.open { transform:rotate(90deg); }
.cat-body { display:none; padding:0 13px 6px; }
.month-pills { display:flex; gap:6px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none; }
.month-pills::-webkit-scrollbar { display:none; }
.pill { font:inherit; font-size:13px; font-weight:500; white-space:nowrap; flex:none;
  background:var(--surface); border:1px solid var(--rule); color:var(--ink-soft);
  border-radius:999px; padding:7px 13px; cursor:pointer; }
.pill.on { background:var(--ink); border-color:var(--ink); color:var(--paper); }
.tapline { cursor:pointer; }
.tapline:active { background:var(--track); }
.trend { padding:10px 0; border-bottom:1px solid var(--rule); }
.trend:last-of-type { border-bottom:none; }
.trend-top { display:flex; align-items:baseline; gap:10px; }
.trend-name { flex:1; min-width:0; font-size:14px; font-weight:600; overflow-wrap:anywhere; }
.trend-avg { font-size:12px; color:var(--ink-soft); white-space:nowrap; }
.spark { display:flex; gap:6px; align-items:flex-end; margin-top:8px; }
.spark-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.spark-bar { width:100%; border-radius:2px 2px 0 0; min-height:2px; }
.spark-lab { font-size:9px; color:var(--ink-faint); }
.sugg { padding:11px 0; border-bottom:1px solid var(--rule); }
.sugg:last-of-type { border-bottom:none; }
.sugg-top { display:flex; align-items:baseline; gap:10px; }
.sugg-name { flex:1; min-width:0; font-size:15px; font-weight:600; overflow-wrap:anywhere; }
.sugg-fig { font-size:15px; font-weight:600; white-space:nowrap; }

    billOccurrences(b,today,addDays(today,400)).forEach(function(d){
      if(state.paid[b.id+"_"+toISO(d)]!==undefined) return;   // already settled
      out.push({id:b.id,name:b.name,date:d,amount:num(b.amount),spread:b.spread!==false,every:num(b.every)});
    });
  });
  out.sort(function(a,b){ return a.date-b.date; });
  return out.slice(0,n||4);
}
var DAYS_PER_MONTH=365.25/12;
function monthlyRates(){
  var debtMin=state.debts.reduce(function(s,d){return s+num(d.minimum);},0);
  var spendM=state.life.filter(function(l){return l.kind!=="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  var saveM=state.life.filter(function(l){return l.kind==="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  return {debt:debtMin+num(state.extraDebtMonthly), spend:spendM, save:saveM};
}
function eventsIn(start,end){
  var out=[];
  state.incomes.forEach(function(inc){
    incomeEvents(inc,start,end).forEach(function(d){ out.push({inc:inc,date:d}); });
  });
  out.sort(function(a,b){ return a.date-b.date; });
  return out;
}
function makePeriod(start,end,index,mr,zeroRates){
  var days=Math.max(1,Math.round((end-start)/86400000));
  var f = zeroRates ? 0 : days/DAYS_PER_MONTH;
  var rates={debt:mr.debt*f, spend:mr.spend*f, save:mr.save*f};
  var income=0, sources=[];
  eventsIn(start,end).forEach(function(e){
    var inc=e.inc, k=inc.id+"_"+toISO(e.date);
    var amt=amountFor(inc,k);
    income+=amt;
    sources.push({incomeId:inc.id,date:e.date,amount:amt,key:k,
                  daily:inc.payType==="daily",days:daysFor(inc,k)});
  });
  var hits=[], aside=0, asideItems=[];
  state.bills.forEach(function(b){
    if(b.spread && (num(b.every)||1)>1){
      var per=monthlyEquiv(b)*f, ak=b.id+"_"+toISO(start);
      aside+=per;
      asideItems.push({id:b.id,key:ak,name:b.name,planned:per,
                       set:state.aside[ak]!==undefined,actual:num(state.aside[ak])});
      return;
    }
    billOccurrences(b,start,end).forEach(function(d){
      var key=b.id+"_"+toISO(d);
      hits.push({id:b.id,key:key,name:b.name,date:d,amount:num(b.amount),varies:!!b.varies,
                 paid:state.paid[key]!==undefined,actual:num(state.paid[key])});
    });
  });
  /* savings goals get the same per-check tick; they're already counted in
     rates.save, so they add nothing to the committed total here */
  state.life.forEach(function(l){
    if(l.kind!=="save" || num(l.monthly)<=0) return;
    var gk=l.id+"_"+toISO(start);
    asideItems.push({id:l.id,key:gk,name:l.name,planned:num(l.monthly)*f,goal:true,
                     set:state.aside[gk]!==undefined,actual:num(state.aside[gk])});
  });
  hits.sort(function(a,b){return a.date-b.date;});
  var billTotal=hits.reduce(function(s,b){return s+b.amount;},0);
  var settled=hits.filter(function(b){return b.paid;});
  var paidTotal=settled.reduce(function(s,b){return s+b.actual;},0);
  var paidPlanned=settled.reduce(function(s,b){return s+b.amount;},0);
  var committed=billTotal+aside+rates.debt+rates.spend+rates.save;
  return {index:index,start:start,end:end,sources:sources,income:income,bills:hits,
    days:days,billTotal:billTotal,aside:aside,asideItems:asideItems,
    paidTotal:paidTotal,paidPlanned:paidPlanned,
    paidCount:settled.length,variance:paidTotal-paidPlanned,
    outstanding:billTotal-paidPlanned,
    debt:rates.debt,spend:rates.spend,save:rates.save,free:income-committed,
    monthKey:start.getFullYear()+"-"+start.getMonth()};
}
function buildPeriods(){
  var today=sod(new Date()), horizon=addDays(today,HORIZON_DAYS);
  var evs=eventsIn(today,horizon);
  if(!evs.length) return [];
  var dayList=[], seen={};
  evs.forEach(function(e){ var k=toISO(e.date); if(!seen[k]){ seen[k]=true; dayList.push(e.date); } });
  var mr=monthlyRates(), periods=[];
  if(dayList[0]>today){
    var gap=makePeriod(today,dayList[0],0,mr,true);
    if(gap.bills.length){ gap.current=true; gap.partial=true; periods.push(gap); }
  }
  for(var i=0;i<dayList.length;i++){
    var stop=(i+1<dayList.length)?dayList[i+1]:addDays(dayList[i],14);
    var pd=makePeriod(dayList[i],stop,i,mr);
    pd.current = pd.start<=today && pd.end>today;
    periods.push(pd);
  }
  periods.forEach(function(x,ix){ x.index=ix; });
  return periods;
}
/* pay periods that have already closed, newest first */
function buildHistory(back){
  var first=primaryPayDates(state.incomes[0],1,true)[0];
  if(!first) return [];
  var mr=monthlyRates(), out=[];
  for(var i=1;i<=(back||4);i++){
    var start=addDays(first,-14*i), end=addDays(first,-14*(i-1));
    out.push(makePeriod(start,end,-i,mr));
  }
  return out;
}
function daysFor(inc,k){
  return state.days[k]!==undefined ? num(state.days[k]) : num(inc.typicalDays);
}
function amountFor(inc,k){
  if(state.overrides[k]!==undefined) return num(state.overrides[k]);   // an actual check, pinned
  if(inc.payType==="daily") return num(inc.dayRate)*daysFor(inc,k);
  return num(inc.baseline);
}
/* what one income contributes to a single pay period, whatever its cadence */
function perPeriod(inc,which){
  if(inc.cadence==="once") return 0;   // a windfall is not a typical check
  var base = inc.payType==="daily"
    ? num(inc.dayRate) * (which==="low" ? num(inc.lowDays) : num(inc.typicalDays))
    : (which==="low" ? num(inc.low) : num(inc.baseline));
  if(inc.cadence==="weekly") return base*2;
  if(inc.cadence==="semimonthly") return base*(24/26);
  if(inc.cadence==="monthly") return base*PER_CHECK;
  return base;
}
/* the next few dates this income actually lands on */
function upcomingDates(inc,n){
  var today=sod(new Date());
  return incomeEvents(inc,today,addDays(today,430)).slice(0,n||4);
}
/* what one income brings in over an average month */
function monthlyIncome(inc){
  if(inc.cadence==="once") return 0;
  var per = inc.payType==="daily"
    ? num(inc.dayRate)*num(inc.typicalDays)
    : num(inc.baseline);
  if(inc.cadence==="weekly") return per*52/12;
  if(inc.cadence==="biweekly") return per*26/12;
  if(inc.cadence==="semimonthly") return per*2;
  return per;
}
/* one-time money landing in the next twelve months */
function oneOffsAhead(){
  var today=sod(new Date()), end=addDays(today,365), out=[];
  state.incomes.forEach(function(inc){
    if(inc.cadence!=="once") return;
    var d=fromISO(inc.firstPayDate);
    if(d && d>=today && d<end) out.push({name:inc.name,date:d,amount:num(inc.baseline)});
  });
  out.sort(function(a,b){ return a.date-b.date; });
  return out;
}
/* gross for the next twelve months, for incomes where a gross figure is known */
function yearGross(){
  var today=sod(new Date()), end=addDays(today,365), known=0, netOfKnown=0, any=false;
  state.incomes.forEach(function(inc){
    var g=num(inc.grossPer); if(g<=0) return;
    any=true;
    var evs=incomeEvents(inc,today,end);
    evs.forEach(function(d){
      var k=inc.id+"_"+toISO(d);
      known += inc.payType==="daily" ? g*daysFor(inc,k) : g;
      netOfKnown += amountFor(inc,k);
    });
  });
  return any ? {gross:known, net:netOfKnown} : null;
}
/* the next twelve months of actual pay events, per income — this respects any
   days or amounts already entered, and counts 26 or 27 checks honestly */
function yearByIncome(){
  var today=sod(new Date()), end=addDays(today,365), out=[];
  state.incomes.forEach(function(inc){
    var evs=incomeEvents(inc,today,end), sum=0;
    evs.forEach(function(d){ sum+=amountFor(inc,inc.id+"_"+toISO(d)); });
    out.push({inc:inc,n:evs.length,sum:sum});
  });
  return out;
}
/* every commitment as one flat, ranked list */
function outflowLines(){
  var out=[];
  state.bills.forEach(function(b){
    if(monthlyEquiv(b)>0) out.push({name:b.name,amount:monthlyEquiv(b),kind:"bills"});
  });
  state.debts.forEach(function(d){
    if(num(d.minimum)>0) out.push({name:d.name,amount:num(d.minimum),kind:"debt"});
  });
  if(num(state.extraDebtMonthly)>0)
    out.push({name:"Extra toward debt",amount:num(state.extraDebtMonthly),kind:"debt"});
  state.life.forEach(function(l){
    if(num(l.monthly)>0) out.push({name:l.name,amount:num(l.monthly),
      kind:"life",note:l.kind==="save"?"saving up":"spending"});
  });
  out.sort(function(a,b){ return b.amount-a.amount; });
  return out;
}
function totals(){
  var bills=state.bills.reduce(function(s,b){return s+monthlyEquiv(b);},0);
  var debtMin=state.debts.reduce(function(s,d){return s+num(d.minimum);},0);
  var debtBal=state.debts.reduce(function(s,d){return s+num(d.balance);},0);
  var spend=state.life.filter(function(l){return l.kind!=="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  var save=state.life.filter(function(l){return l.kind==="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  return {bills:bills,debtMin:debtMin,debtBal:debtBal,spend:spend,save:save,
    out:bills+debtMin+num(state.extraDebtMonthly)+spend+save};
}
function simulate(extraMonthly,strategy){
  var act=[];
  state.debts.forEach(function(d,i){
    if(num(d.balance)>0) act.push({id:d.id,balance:num(d.balance),apr:num(d.apr),
                                   minimum:num(d.minimum),rank:i});
  });
  if(!act.length) return null;
  var month=0, interest=0, payoff={}, MAX=600;
  while(act.some(function(d){return d.balance>0.01;}) && month<MAX){
    month++;
    act.forEach(function(d){ if(d.balance>0.01){ var i=d.balance*(d.apr/100/12); d.balance+=i; interest+=i; } });
    var pool=extraMonthly;
    act.forEach(function(d){
      if(d.balance>0.01) d.balance-=Math.min(d.minimum,d.balance);
      else pool+=d.minimum;
    });
    var order=act.filter(function(d){return d.balance>0.01;}).sort(function(a,b){
      if(strategy==="avalanche") return b.apr-a.apr;
      if(strategy==="snowball") return a.balance-b.balance;
      return a.rank-b.rank;                       // the order you arranged them in
    });
    for(var j=0;j<order.length&&pool>0.01;j++){
      var pay=Math.min(pool,order[j].balance); order[j].balance-=pay; pool-=pay;
    }
    act.forEach(function(d){ if(d.balance<=0.01&&!payoff[d.id]){ payoff[d.id]=month; d.balance=0; } });
  }
  return {months:month,interest:interest,payoff:payoff,stalled:month>=MAX};
}

  render(); idle();

  if(!(window.claude && typeof window.claude.use==="function")) return;

    if(!db) return;

function saveFile(filename,data,mime){
  if(window.claude && typeof window.claude.use==="function"){
    return window.claude.use("downloads").then(function(dl){
      if(!dl) return blobSave(filename,data,mime);
      return dl.save({filename:filename,data:data}).then(function(){
        setStatus("Saved file"); setTimeout(idle,2000);
      }).catch(function(e){
        if(e && e.code==="declined"){ idle(); return; }
        blobSave(filename,data,mime);
      });
    }).catch(function(){ blobSave(filename,data,mime); });
  }
  return Promise.resolve(blobSave(filename,data,mime));
}
function blobSave(filename,data,mime){
  try{
    var blob=new Blob([data],{type:mime});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },4000);
    setStatus("Saved file"); setTimeout(idle,2000);
  }catch(e){ setStatus("Could not save file",true); setTimeout(idle,3000); }
}

function icsEscape(t){ return String(t||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g," "); }
function buildICS(){

var IGNORE="__ignore__";

/* RFC 4180-ish: quoted fields, doubled quotes, commas and newlines inside quotes */
function parseCSV(text){
  var rows=[], row=[], f="", q=false, c;
  text=String(text||"").replace(/^\uFEFF/,"");
  for(var i=0;i<text.length;i++){
    c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(f); f="";
      if(row.some(function(x){ return x.trim()!==""; })) rows.push(row);
      row=[];
    } else f+=c;
  }
  if(f!==""||row.length){ row.push(f); if(row.some(function(x){ return x.trim()!==""; })) rows.push(row); }
  return rows;
}
function parseAmt(v){
  var t=String(v||"").trim(); if(!t) return NaN;
  var neg=/^\(.*\)$/.test(t)||/^-/.test(t)||/-$/.test(t)||/^\$?\s*-/.test(t);
  var n=parseFloat(t.replace(/[^0-9.]/g,""));
  return isFinite(n) ? (neg?-n:n) : NaN;
}
function parseDateLoose(v){
  var t=String(v||"").trim(), m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return sod(new Date(+m[1],+m[2]-1,+m[3]));
  if((m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){
    var y=+m[3]; if(y<100) y+=2000;
    return sod(new Date(y,+m[1]-1,+m[2]));          /* US order: month first */
  }
  var ms=Date.parse(t); return isNaN(ms)?null:sod(new Date(ms));
}
/* "TJ MAXX #1234 COLUMBUS IN" and "TJ MAXX 5566" should be the same shop */
function normMerchant(v){
  var t=String(v||"").toUpperCase();
  t=t.replace(/[*#].*$/,"");
  t=t.replace(/\b\d[\d\-]*\b/g," ");
  t=t.replace(/[^A-Z&' ]/g," ").replace(/\s+/g," ").trim();
  var w=t.split(" ").filter(Boolean);
  if(w.length>2 && /^[A-Z]{2}$/.test(w[w.length-1])) w.pop();   /* trailing state */
  return w.slice(0,3).join(" ")||"UNKNOWN";
}
function detectCols(h){
  var L=h.map(function(x){ return String(x).toLowerCase().trim(); });
  function find(res){
    for(var r=0;r<res.length;r++) for(var i=0;i<L.length;i++) if(res[r].test(L[i])) return i;
    return -1;
  }
  return {
    date:  find([/^transaction date/,/^trans\.? ?date/,/^date$/,/^posting date/,/^posted/,/date/]),
    merch: find([/^merchant$/]),
    desc:  find([/^description/,/payee/,/^name$/,/memo/,/details/,/merchant/]),
    amount:find([/^amount/,/^amt/]),
    debit: find([/debit/,/withdrawal/,/money out/]),
    credit:find([/^credit/,/deposit/,/money in/]),
    cat:   find([/^category$/]),
    type:  find([/^type$/,/transaction type/])
  };
}
/* card payments and paychecks are transfers, not spending — counting them
   would double every purchase that was paid for from checking */
var INFLOW_SKIP=/payment|transfer|xfer|payroll|direct dep|dir dep|deposit|paycheck|salary|interest paid/i;
var OUTFLOW_SKIP=/applecard|apple card|gs bank|gsbank|goldman sachs|card pmt|credit card pmt|transfer to|xfer to/i;

function readStatement(text){
  var rows=parseCSV(text);
  if(rows.length<2) return {error:"That file doesn't look like a statement \u2014 fewer than two rows."};
  var hi=0;
  for(var r=0;r<Math.min(rows.length,10);r++){
    if(rows[r].some(function(c){ return /date/i.test(c); })){ hi=r; break; }
  }
  var header=rows[hi], body=rows.slice(hi+1), cols=detectCols(header);
  if(cols.date<0) return {error:"Couldn't find a date column.", header:header};
  if(cols.desc<0 && cols.merch<0) return {error:"Couldn't find a description column.", header:header};
  if(cols.amount<0 && cols.debit<0) return {error:"Couldn't find an amount column.", header:header};

  /* purchases are the majority of rows on any statement, so whichever sign
     most rows carry is the sign of money going out */
  var pos=0, negs=0;
  if(cols.amount>=0) body.forEach(function(rw){
    var a=parseAmt(rw[cols.amount]); if(a>0) pos++; else if(a<0) negs++;
  });
  var outPositive = cols.amount<0 ? true : pos>=negs;
  var isCard = header.some(function(c){ return /clearing date/i.test(c); });
  return {header:header, body:body, cols:cols, outPositive:outPositive,
          source: isCard ? "Apple Card" : "Checking"};
}
function stageTxns(st, sourceName, outPositive, batchId){
  var out=[], seen={}, bad=0;
  batchId = batchId || "b"+Date.now();
  st.body.forEach(function(rw){
    var d=parseDateLoose(rw[st.cols.date]);
    var amt;
    if(st.cols.amount>=0){
      amt=parseAmt(rw[st.cols.amount]);
      if(isFinite(amt) && !outPositive) amt=-amt;
    } else {
      var db=parseAmt(rw[st.cols.debit]), cr=parseAmt(rw[st.cols.credit]);
      amt=(isFinite(db)?Math.abs(db):0)-(isFinite(cr)?Math.abs(cr):0);
    }
    if(!d || !isFinite(amt) || amt===0){ bad++; return; }
    var raw=String(rw[st.cols.desc>=0?st.cols.desc:st.cols.merch]||"").trim();
    var shown=st.cols.merch>=0 && rw[st.cols.merch] ? String(rw[st.cols.merch]).trim() : raw;
    var m=normMerchant(shown);
    var type=st.cols.type>=0 ? String(rw[st.cols.type]||"") : "";
    var ext=st.cols.cat>=0 ? String(rw[st.cols.cat]||"").trim() : "";
    var inflow=amt<0;
    var skip = /^payment$/i.test(type) || (inflow && INFLOW_SKIP.test(raw+" "+type))
               || (!inflow && OUTFLOW_SKIP.test(raw));
    var base=toISO(d)+"|"+amt.toFixed(2)+"|"+m+"|"+sourceName;
    seen[base]=(seen[base]||0)+1;
    out.push({id:base+"#"+seen[base], d:toISO(d), m:m, n:shown.slice(0,40),
              a:Math.round(amt*100)/100, s:sourceName, x:ext.slice(0,24), b:batchId,
              c: skip ? IGNORE : (state.rules[m]||"")});
  });
  return {txns:out, bad:bad};
}
function commitTxns(list){
  var have={}, added=0, dup=0;
  state.txns.forEach(function(t){ have[t.id]=true; });
  list.forEach(function(t){ if(have[t.id]) dup++; else { state.txns.push(t); added++; } });
  state.txns.sort(function(a,b){ return a.d<b.d?1:a.d>b.d?-1:0; });
  return {added:added, dup:dup};
}
/* imports, newest first, so one can be taken back out */
function importBatches(){
  var acc={};
  state.txns.forEach(function(t){
    var k=t.b||"legacy";
    if(!acc[k]) acc[k]={id:k,n:0,sum:0,src:t.s,lo:t.d,hi:t.d};
    acc[k].n++; if(t.c!==IGNORE) acc[k].sum+=num(t.a);
    if(t.d<acc[k].lo) acc[k].lo=t.d;
    if(t.d>acc[k].hi) acc[k].hi=t.d;
  });
  var out=[]; for(var k2 in acc) out.push(acc[k2]);
  out.sort(function(a,b){ return a.id<b.id?1:-1; });
  return out;
}
/* what kind of money a category represents */
function billByName(n){
  for(var i=0;i<state.bills.length;i++) if(state.bills[i].name===n) return state.bills[i];
  return null;
}
function catKind(c){
  if(!c) return "none";
  if(c===IGNORE) return "ignore";
  for(var i=0;i<state.life.length;i++)
    if(state.life[i].kind!=="save" && state.life[i].name===c) return "allowance";
  if(billByName(c)) return "bill";
  if((state.catList||[]).indexOf(c)>=0) return "bill";
  return "unplanned";
}
/* a transaction filed against a bill can tick that bill paid, with the real amount */
function syncPaidFromTxns(){
  var n=0;
  state.txns.forEach(function(t){
    if(!t.c || t.c===IGNORE || num(t.a)<=0) return;
    var b=billByName(t.c); if(!b) return;
    var d=fromISO(t.d); if(!d) return;
    var best=null, bestGap=1e15;
    billOccurrences(b,addDays(d,-18),addDays(d,18)).forEach(function(o){
      var gap=Math.abs(o-d);
      if(gap<bestGap){ bestGap=gap; best=o; }
    });
    if(!best || bestGap>12*86400000) return;      /* no occurrence close enough */
    var key=b.id+"_"+toISO(best);
    if(state.paid[key]===undefined){ state.paid[key]=num(t.a); n++; }
  });
  return n;
}
function txnCategoryOptions(){
  var out=[], seen={};
  function add(c){ if(c && !seen[c]){ seen[c]=true; out.push(c); } }
  state.life.forEach(function(l){ if(l.kind!=="save") add(l.name); });
  state.bills.forEach(function(b){ add(b.name); });
  (state.catList||[]).forEach(add);
  (state.txnCats||[]).forEach(add);
  state.txns.forEach(function(t){ if(t.c && t.c!==IGNORE) add(t.c); });
  return out;
}
function setTxnCategory(t,c){
  t.c=c;
  if(c && c!==IGNORE) state.rules[t.m]=c; else if(c===IGNORE) state.rules[t.m]=IGNORE;
  /* teach the rest of this merchant's uncategorised rows */
  state.txns.forEach(function(o){ if(o!==t && o.m===t.m && !o.c) o.c=c; });
  syncPaidFromTxns();
}
function trendData(){
  var months=completeMonths().slice(-6);
  if(months.length<2) return null;
  var inSet={}; months.forEach(function(k){ inSet[k]=true; });
  var acc={};
  state.txns.forEach(function(t){
    if(!t.c||t.c===IGNORE) return;
    var k=t.d.slice(0,7); if(!inSet[k]) return;
    if(!acc[t.c]) acc[t.c]={};
    acc[t.c][k]=(acc[t.c][k]||0)+t.a;
  });
  var out=[];
  for(var c in acc){
    var vals=months.map(function(k){ return acc[c][k]||0; });
    var tot=0, mx=0;
    vals.forEach(function(v){ tot+=v; if(v>mx) mx=v; });
    out.push({cat:c, vals:vals, avg:tot/months.length, max:mx, kind:catKind(c)});
  }
  out.sort(function(a,b){ return b.avg-a.avg; });
  return {months:months, list:out};
}

/* swap an item with its neighbour, counting only items of the same kind so the
   two Life lists reorder independently inside one array */
function moveItem(listKey,id,dir,peer){
  var arr=state[listKey], peers=[], here=-1;
  for(var i=0;i<arr.length;i++) if(!peer||peer(arr[i])) peers.push(i);
  for(var j=0;j<peers.length;j++) if(arr[peers[j]].id===id) here=j;
  if(here<0) return false;
  var there=here+dir;
  if(there<0||there>=peers.length) return false;
  var a=peers[here], b=peers[there], tmp=arr[a];
  arr[a]=arr[b]; arr[b]=tmp;
  return true;
}
function reRender(){
  var y=window.scrollY||window.pageYOffset||0;
  render();
  window.scrollTo(0,y);
}
function moveHandler(listKey,id,dir,peer){
  return function(){ if(moveItem(listKey,id,dir,peer)){ touched(); reRender(); } };
}

/* ===================== cloud bridge ===================== */
var cloud=null, gate=null, gateErr="", gateBusy=false, remotePending=null;
function snapshotState(){ return JSON.parse(JSON.stringify(state)); }
function isEditing(){
  var a=document.activeElement;
  return !!(a && (a.tagName==="INPUT"||a.tagName==="SELECT"));
}
document.addEventListener("blur",function(){
  if(remotePending && !isEditing()){
    var o=remotePending; remotePending=null;
    state=normalize(o); cacheLocal(); render();
  }
},true);

window.Ledger={
  build:BUILD,
  getState:snapshotState,
  /* a change from the other phone — never stomp on a field being typed in */
  applyRemote:function(obj){
    if(isEditing()){ remotePending=obj; return; }
    state=normalize(obj); syncPaidFromTxns(); cacheLocal(); render();
  },
  attach:function(c){ cloud=c; gate=null; store="cloud"; render(); idle(); },
  detach:function(){ cloud=null; store=lsOK?"local":"none"; },
  status:function(t,bad){ setStatus(t,!!bad); },
  askSignIn:function(handler,err){
    gate="signin"; gateErr=err||""; gateBusy=false; window.__gateSubmit=handler; render();
  },
  connecting:function(){ gate="loading"; render(); },
  failed:function(msg){ gate=null; logError(msg); render(); }
};

  var t=document.getElementById("tabs"); if(t) t.style.display="none";

    gateBusy=true; go.textContent="Signing in…"; errBox.textContent="";

  c.appendChild(go); c.appendChild(errBox);
  m.appendChild(c);

/* months with imported data, excluding the one we're still living through —
   a half-imported month would drag every average down */
function completeMonths(){
  var n0=new Date(), cur=n0.getFullYear()+"-"+pad2(n0.getMonth()+1);
  var seen={}, out=[];
  state.txns.forEach(function(t){ var k=t.d.slice(0,7); if(k!==cur) seen[k]=true; });
  for(var k in seen) out.push(k);
  return out.sort();
}
/* what each category has actually cost per month, over those months */
function categoryAverages(){
  var months=completeMonths();
  if(!months.length) return null;
  var inSet={}; months.forEach(function(k){ inSet[k]=true; });
  var acc={};
  state.txns.forEach(function(t){
    if(!t.c || t.c===IGNORE) return;
    var k=t.d.slice(0,7); if(!inSet[k]) return;
    if(!acc[t.c]) acc[t.c]={vals:{}};
    acc[t.c].vals[k]=(acc[t.c].vals[k]||0)+t.a;
  });
  var out=[];
  for(var c in acc){
    var total=0, hi=0, seenN=0;
    for(var k2 in acc[c].vals){
      var v=acc[c].vals[k2]; total+=v; seenN++; if(v>hi) hi=v;
    }
    /* divide by every complete month, not just the ones it appeared in */
    out.push({cat:c, avg:total/months.length, hi:hi, seen:seenN, kind:catKind(c)});
  }
  out.sort(function(a,b){ return b.avg-a.avg; });
  return {months:months, list:out};
}
function plannedFor(cat){
  for(var i=0;i<state.life.length;i++)
    if(state.life[i].kind!=="save" && state.life[i].name===cat) return state.life[i];
  return null;
}

  m.appendChild(mp);

  var tx=state.txns.filter(function(t){ return t.d.slice(0,7)===spentMonth; });
  var live=tx.filter(function(t){ return t.c!==IGNORE; });
  var by={}, total=0;
  live.forEach(function(t){ var k=t.c||""; by[k]=(by[k]||0)+t.a; total+=t.a; });
  var sumKind=function(kind){ var v=0; for(var k in by) if(catKind(k)===kind) v+=by[k]; return v; };
  var allow=sumKind("allowance"), bills=sumKind("bill"), unplanned=sumKind("unplanned"), unsorted=by[""]||0;

  /* ---------- the answer ---------- */
  var sum=el("section","card");
  sum.appendChild(el("h2",null,"Where "+monthLabel(spentMonth)+" went"));
  var big=el("div","hero-amt",money(total)); sum.appendChild(big);
  sum.appendChild(el("div","hero-note","spent across "+live.length+" transactions, transfers left out"));
  var bar=el("div","bar"); bar.style.marginTop="14px";
  [[bills,C.bills],[allow,C.life],[unplanned,C.short],[unsorted,C.faint]].forEach(function(x){
    if(x[0]<=0) return;
    var sgm=el("div","bar-seg"); sgm.style.width=(x[0]/Math.max(total,1)*100)+"%"; sgm.style.background=x[1];
    bar.appendChild(sgm);
  });
  sum.appendChild(bar);
  sum.appendChild(lineRow("Bills","already planned",money(bills),C.bills));
  sum.appendChild(lineRow("Spending money","groceries, gas \u2014 planned",money(allow),C.life));
  sum.appendChild(lineRow("Not in the plan","this is your unassigned money",money(unplanned),C.short));
  if(unsorted) sum.appendChild(lineRow("Not sorted yet","needs a category below",money(unsorted),C.faint));
  var t2=totals(), incM=0; state.incomes.forEach(function(x){ incM+=monthlyIncome(x); });
  var unassigned=incM-(t2.bills+t2.debtMin+num(state.extraDebtMonthly)+t2.spend+t2.save);
  if(unassigned>0 && (unplanned+unsorted)>0){
    var share=Math.round((unplanned+unsorted)/unassigned*100);
    sum.appendChild(el("p","muted foot","A typical month leaves "+money0(unassigned)+" unassigned. "
      +money0(unplanned+unsorted)+" of it \u2014 "+share+"% \u2014 went to things outside the plan this month."));
  }
  m.appendChild(sum);

  /* ---------- the unplanned, ranked ---------- */
  var un=[]; for(var k in by) if(catKind(k)==="unplanned") un.push([k,by[k]]);
  un.sort(function(a,b){ return b[1]-a[1]; });
  if(un.length){
    var uc=el("section","card");
    uc.appendChild(el("h2",null,"Where the unassigned money went"));
    un.forEach(function(x){
      var n2=live.filter(function(t){ return t.c===x[0]; }).length;
      var rw=lineRow(x[0], n2+(n2===1?" purchase":" purchases"), money(x[1]), C.short);
      rw.className+=" tapline";
      rw.addEventListener("click",safe(function(){
        spentFilter = spentFilter===x[0] ? null : x[0];
        showAllTx=true; reRender();
      }));
      uc.appendChild(rw);
    });
    uc.appendChild(el("p","muted foot","Tap one to see the purchases behind it."));
    m.appendChild(uc);
  }

  /* ---------- turn what you found into a plan ---------- */
  var ca=categoryAverages();
  if(ca){
    var sugg=ca.list.filter(function(x){ return x.kind==="unplanned"||x.kind==="allowance"; })
                    .filter(function(x){ return x.avg>=1; });
    if(sugg.length){
      var pc=el("section","card");
      pc.appendChild(el("h2",null,"Make this part of the plan"));
      var mnames=ca.months.map(monthLabel).join(", ");
      pc.appendChild(el("p","muted", ca.months.length===1
        ? "Based on one complete month ("+mnames+"). Worth a second statement before you budget from it \u2014 one month is an anecdote."
        : "Averaged over "+ca.months.length+" complete months ("+mnames+"). The current month is left out because it's only part-imported."));

      var extra=0;
      sugg.forEach(function(x){
        var plan=plannedFor(x.cat), want=Math.round(x.avg);
        var cur=plan?num(plan.monthly):0;
        if(want>cur) extra+=want-cur;
        var wrap=el("div","sugg");
        var top=el("div","sugg-top");
        top.appendChild(el("span","sugg-name",x.cat));
        var fig=el("span","sugg-fig",money0(x.avg)+" a month");
        top.appendChild(fig);
        wrap.appendChild(top);
        var note=el("div","sugg-note");
        if(!plan) note.textContent="Not in the plan \u00b7 seen in "+x.seen+" of "+ca.months.length
          +(ca.months.length===1?" month":" months")+" \u00b7 worst "+money0(x.hi);
        else if(Math.abs(x.avg-cur)<1) note.textContent="Planned "+money0(cur)+" \u00b7 matching what you spend";
        else note.textContent="Planned "+money0(cur)+" \u00b7 "
          +(x.avg>cur?"running "+money0(x.avg-cur)+" over":"running "+money0(cur-x.avg)+" under");
        wrap.appendChild(note);
        var acts=el("div","varies-btns");
        if(!plan){
          acts.appendChild(btn("mini","Add at "+money0(want),function(){
            state.life.push({id:uid(),name:x.cat,kind:"spend",monthly:want});
            touched(); reRender();
          }));
          if(Math.round(x.hi)>want) acts.appendChild(btn("mini","Add at worst month "+money0(x.hi),function(){
            state.life.push({id:uid(),name:x.cat,kind:"spend",monthly:Math.round(x.hi)});
            touched(); reRender();
          }));
        } else if(Math.abs(want-cur)>=1){
          acts.appendChild(btn("mini",(want>cur?"Raise to ":"Lower to ")+money0(want),function(){
            plan.monthly=want; touched(); reRender();
          }));
        } else {
          acts.appendChild(el("span","sugg-ok","Planned about right."));
        }
        wrap.appendChild(acts);
        pc.appendChild(wrap);
      });

      if(extra>0){
        var incM2=0; state.incomes.forEach(function(x){ incM2+=monthlyIncome(x); });
        var t3=totals();
        var un=incM2-(t3.bills+t3.debtMin+num(state.extraDebtMonthly)+t3.spend+t3.save);
        var after=un-extra;
        var warn=el("p","muted foot");
        warn.textContent="Taking every suggestion commits "+money0(extra)+" more a month, moving your unassigned money from "
          +money0(un)+" to "+money0(after)+". That isn't money disappearing \u2014 it already left. The plan would just stop pretending otherwise.";
        if(after<0) warn.textContent+=" That would put you under water on paper, which means some of this spending has to come down rather than be budgeted for.";
        pc.appendChild(warn);
      }
      m.appendChild(pc);
    }
  }

  /* ---------- allowances against the plan ---------- */
  var al=state.life.filter(function(l){ return l.kind!=="save" && num(l.monthly)>0; });
  if(al.length){
    var ac=el("section","card");
    ac.appendChild(el("h2",null,"Spending money against the plan"));
    al.forEach(function(l){
      var got=by[l.name]||0, diff=got-num(l.monthly);
      ac.appendChild(lineRow(l.name, money0(num(l.monthly))+" planned",
        money(got), diff>0.5?C.short:C.free));
    });
    ac.appendChild(el("p","muted foot","Red means over for the month. A category only fills once its purchases are sorted into it."));
    m.appendChild(ac);
  }

  /* ---------- sort the stragglers ---------- */
  var td=trendData();
  if(td && td.list.length){
    var tc=el("section","card");
    tc.appendChild(el("h2",null,"Month by month"));
    tc.appendChild(el("p","muted","The last "+td.months.length+" complete months. A steady bar is a habit you can budget; a spiky one isn't."));
    td.list.slice(0,8).forEach(function(x){
      var w2=el("div","trend");
      var top=el("div","trend-top");
      top.appendChild(el("span","trend-name",x.cat));
      top.appendChild(el("span","trend-avg",money0(x.avg)+" avg"));
      w2.appendChild(top);
      var sp=el("div","spark");
      x.vals.forEach(function(v,i){
        var col=el("div","spark-col");
        var b3=el("div","spark-bar");
        b3.style.height=Math.max(2,x.max>0?(v/x.max)*34:2)+"px";
        b3.style.background=v>0?C[x.kind==="unplanned"?"short":x.kind==="bill"?"bills":"life"]:cssVar("--track");
        b3.title=monthLabel(td.months[i])+": "+money(v);
        col.appendChild(b3);
        col.appendChild(el("span","spark-lab",MONTHS[+td.months[i].split("-")[1]-1].slice(0,3)));
        sp.appendChild(col);
      });
      w2.appendChild(sp);
      tc.appendChild(w2);
    });
    m.appendChild(tc);
  }

  var needs=tx.filter(function(t){ return !t.c; });
  var bucket=el("section","card");
  bucket.appendChild(el("h2",null, needs.length ? needs.length+" still need a category" : "Every purchase this month"));
  if(needs.length) bucket.appendChild(el("p","muted","Sort one and every other purchase from the same shop follows, now and in future imports."));
  var shown = needs.length && !showAllTx ? needs : tx;
  if(spentFilter){
    shown = tx.filter(function(t){ return t.c===spentFilter; });
    var chip=el("div","varies-btns");
    chip.appendChild(btn("mini","Showing "+spentFilter+" \u2014 tap to clear",function(){
      spentFilter=null; reRender();
    }));
    bucket.appendChild(chip);
  }
  shown.forEach(function(t){ bucket.appendChild(txnRow(t)); });
  if(needs.length){
    bucket.appendChild(btn("add", showAllTx?"Show only the unsorted":"Show all "+tx.length+" transactions",function(){
      showAllTx=!showAllTx; reRender();
    }));
  }
  m.appendChild(bucket);

  /* ---------- imports and rules ---------- */
  var bats=importBatches();
  if(bats.length){
    var bc=el("section","card");
    bc.appendChild(el("h2",null,"Imports"));
    bats.slice(0,8).forEach(function(b4){
      var rw2=el("div","srow");
      var t4=el("div","srow-top");
      t4.appendChild(el("span","sugg-name",b4.src+" \u00b7 "+b4.n+" rows"));
      var x4=el("button","cat-del","Remove");
      x4.addEventListener("click",safe(function(){
        if(!confirm("Remove these "+b4.n+" transactions? Categories you've taught it are kept.")) return;
        state.txns=state.txns.filter(function(t5){ return (t5.b||"legacy")!==b4.id; });
        touched(); reRender();
      }));
      t4.appendChild(x4);
      rw2.appendChild(t4);
      rw2.appendChild(el("div","sugg-note",fmtShort(fromISO(b4.lo))+" \u2013 "+fmtShort(fromISO(b4.hi))+" \u00b7 "+money(b4.sum)));
      bc.appendChild(rw2);
    });
    m.appendChild(bc);
  }

  var rk=Object.keys(state.rules||{});
  if(rk.length){
    var rc=el("section","card");
    rc.appendChild(el("h2",null,"What goes where"));
    rc.appendChild(el("p","muted","Shops you've sorted. Future imports follow these automatically."));
    rk.sort().forEach(function(mk){
      var rw3=el("div","srow");
      var t6=el("div","srow-top");
      t6.appendChild(el("span","sugg-name",mk));
      var x6=el("button","del","\u00d7"); x6.setAttribute("aria-label","Forget this rule");
      x6.addEventListener("click",safe(function(){ delete state.rules[mk]; touched(); reRender(); }));
      t6.appendChild(x6);
      rw3.appendChild(t6);
      var sel2=document.createElement("select"); sel2.className="sel";
      var o2=[[IGNORE,"Ignore \u2014 transfer or payment"]];
      txnCategoryOptions().forEach(function(c){ o2.unshift([c,c]); });
      o2.forEach(function(o){ var op=document.createElement("option"); op.value=o[0]; op.textContent=o[1]; sel2.appendChild(op); });
      sel2.value=state.rules[mk];
      sel2.addEventListener("change",safe(function(){
        state.rules[mk]=sel2.value;
        state.txns.forEach(function(t7){ if(t7.m===mk) t7.c=sel2.value; });
        syncPaidFromTxns(); touched(); reRender();
      }));
      var f6=el("div","srow-fields"); var g6=el("div","sfield");
      g6.appendChild(el("span","sflabel","Files as")); g6.appendChild(sel2);
      f6.appendChild(g6); rw3.appendChild(f6);
      rc.appendChild(rw3);
    });
    m.appendChild(rc);
  }
}
function txnRow(t){
  var r=el("div","txn"+(t.c===IGNORE?" ignored":""));
  var top=el("div","txn-top");
  top.appendChild(el("span","txn-date",fmtShort(fromISO(t.d))));
  top.appendChild(el("span","txn-name",t.n||t.m));
  var amt=el("span","txn-amt",(t.a<0?"\u2212":"")+money(Math.abs(t.a)));
  if(t.a<0) amt.style.color=cssVar("--free");
  top.appendChild(amt);
  var del=el("button","del","\u00d7"); del.setAttribute("aria-label","Delete this transaction");
  del.addEventListener("click",safe(function(){
    state.txns=state.txns.filter(function(o){ return o!==t; });
    touched(); reRender();
  }));
  top.appendChild(del);
  r.appendChild(top);
  var sel=document.createElement("select"); sel.className="sel";
  var opts=[["","Needs a category"]];
  txnCategoryOptions().forEach(function(c){ opts.push([c,c]); });
  opts.push([IGNORE,"Ignore \u2014 transfer or payment"]);
  opts.push(["__new__","New category\u2026"]);
  opts.forEach(function(o){ var op=document.createElement("option"); op.value=o[0]; op.textContent=o[1]; sel.appendChild(op); });
  sel.value=t.c||"";
  sel.addEventListener("change",safe(function(){
    var v=sel.value;
    if(v==="__new__"){
      var name=(prompt("Name for the new category? (e.g. Amazon, Clothes, Household)")||"").trim();
      if(!name){ sel.value=t.c||""; return; }
      if(state.txnCats.indexOf(name)<0) state.txnCats.push(name);
      v=name;
    }
    setTxnCategory(t,v); touched(); reRender();
  }));
  var sub3=el("div","txn-sub");
  sub3.appendChild(sel);
  var meta=el("span","txn-meta",t.s+(t.x?" \u00b7 "+t.x:""));
  sub3.appendChild(meta);
  r.appendChild(sub3);
  return r;
}

function renderIncome(m){
  var card=el("section","card"), estCells=[], dateCells=[], stubCells=[];
  function paintStub(){
    stubCells.forEach(function(c){
      var v=stub[c.inc.id]||{}, g=num(v.g), n=num(v.n);
      c.res.innerHTML=""; c.act.innerHTML="";
      if(g<=0||n<=0){
        c.res.textContent="Enter the gross and net from one stub and this works out the rest.";
        return;
      }
      var kept=n/g, tookPct=Math.round((1-kept)*1000)/10;
      if(c.inc.payType==="daily"){
        var dd=num(v.d);
        if(dd<=0){ c.res.textContent="Add the number of days that stub covered."; return; }
        var perDay=n/dd;
        c.res.textContent=money(perDay)+" take-home a day \u00b7 "+tookPct+"% withheld \u00b7 gross "+money(g/dd)+" a day";
        c.act.appendChild(btn("mini","Use "+money(perDay)+" a day",function(){
          c.inc.dayRate=Math.round(perDay*100)/100;
          c.inc.grossPer=Math.round(g/dd*100)/100;
          touched(); reRender();
        }));
      } else {
        c.res.textContent=money(n)+" take-home a check \u00b7 "+tookPct+"% withheld";
        c.act.appendChild(btn("mini","Use "+money(n)+" a check",function(){
          c.inc.baseline=n; c.inc.grossPer=g; touched(); reRender();
        }));
      }
    });
  }
  card.appendChild(el("h2",null,"Money coming in"));
  card.appendChild(el("p","muted","Set a baseline you can count on in a light pay period, not your best one. Every bill and fund below gets sized to fit that number, so a slow stretch never breaks the plan."));
  state.incomes.forEach(function(inc,idx){
    var b=el("div","block");
    b.appendChild(row([textInput(function(){return inc.name;},function(v){inc.name=v;})],
      idx>0?function(){ state.incomes=state.incomes.filter(function(x){return x.id!==inc.id;}); touched(); render(); }:null));
    var oneOff = inc.cadence==="once";
    var kind=document.createElement("select"); kind.className="sel";
    [["fixed","Same amount each check"],["daily","By the day worked"]].forEach(function(o){
      var op=document.createElement("option"); op.value=o[0]; op.textContent=o[1]; kind.appendChild(op);
    });
    kind.value=inc.payType==="daily"?"daily":"fixed";
    kind.addEventListener("change",safe(function(){ inc.payType=kind.value; touched(); render(); }));
    if(!oneOff) b.appendChild(row([el("label",null,"How it's paid"),kind]));

    if(oneOff){
      b.appendChild(row([el("label",null,"Amount"),
        moneyInput(function(){return num(inc.baseline);},function(v){inc.baseline=v;})]));
    } else if(inc.payType==="daily"){
      b.appendChild(row([el("label",null,"Take-home per day"),
        moneyInput(function(){return num(inc.dayRate);},function(v){inc.dayRate=v;})]));
      b.appendChild(row([el("label",null,"Gross per day"),
        moneyInput(function(){return num(inc.grossPer);},function(v){inc.grossPer=v;})]));
      b.appendChild(row([el("label",null,"Days in a typical check"),
        countInput(function(){return num(inc.typicalDays);},function(v){inc.typicalDays=v;})]));
      b.appendChild(row([el("label",null,"Fewest days you'd work"),
        countInput(function(){return num(inc.lowDays);},function(v){inc.lowDays=v;})]));
      var est=el("p","muted foot");
      estCells.push({el:est,inc:inc});
      b.appendChild(est);
    } else {
      b.appendChild(row([el("label",null,"Typical check"),moneyInput(function(){return num(inc.baseline);},function(v){inc.baseline=v;})]));
      b.appendChild(row([el("label",null,"Gross per check"),
        moneyInput(function(){return num(inc.grossPer);},function(v){inc.grossPer=v;})]));
      b.appendChild(row([el("label",null,"A slow check"),moneyInput(function(){return num(inc.low);},function(v){inc.low=v;})]));
    }
    if(oneOff) b.appendChild(el("p","muted foot","A one-time payment. It lands in whichever check covers that date, and stays out of your typical-check figures so it can't flatter the plan."));
    var sel=document.createElement("select"); sel.className="sel";
    [["weekly","Every week"],["biweekly","Every 2 weeks"],["semimonthly","1st and 15th"],
     ["monthly","Once a month"],["once","One time only"]].forEach(function(o){
      var op=document.createElement("option"); op.value=o[0]; op.textContent=o[1]; sel.appendChild(op);
    });
    sel.value=inc.cadence;
    sel.addEventListener("change",safe(function(){ inc.cadence=sel.value; refresh(); touched(); }));
    b.appendChild(row([el("label",null,"Paid"),sel]));
    var dt=document.createElement("input"); dt.type="date"; dt.className="date"; dt.value=inc.firstPayDate||"";
    dt.addEventListener("change",safe(function(){ inc.firstPayDate=dt.value; render(); touched(); }));
    b.appendChild(row([el("label",null,oneOff?"Date it lands":"Next pay date"),dt]));
    var when=el("p","muted foot"); dateCells.push({el:when,inc:inc}); b.appendChild(when);
    /* the only honest way to get a take-home rate: read it off a real stub */
    var calc=el("div","stub");
    calc.appendChild(el("div","stub-head","Work it out from a pay stub"));
    var f=el("div","stub-fields");
    var sg=el("div","sfield"); sg.appendChild(el("span","sflabel","Gross on stub"));
    var sgi=moneyInput(function(){return stub[inc.id]&&stub[inc.id].g||0;},
      function(v){ stub[inc.id]=stub[inc.id]||{}; stub[inc.id].g=v; paintStub(); },110);
    sg.appendChild(sgi); f.appendChild(sg);
    var sn=el("div","sfield"); sn.appendChild(el("span","sflabel","Net on stub"));
    var sni=moneyInput(function(){return stub[inc.id]&&stub[inc.id].n||0;},
      function(v){ stub[inc.id]=stub[inc.id]||{}; stub[inc.id].n=v; paintStub(); },110);
    sn.appendChild(sni); f.appendChild(sn);
    if(inc.payType==="daily"){
      var sd=el("div","sfield"); sd.appendChild(el("span","sflabel","Days on stub"));
      sd.appendChild(countInput(function(){return stub[inc.id]&&stub[inc.id].d||0;},
        function(v){ stub[inc.id]=stub[inc.id]||{}; stub[inc.id].d=v; paintStub(); },56));
      f.appendChild(sd);
    }
    calc.appendChild(f);
    var res=el("div","stub-res"), act=el("div","varies-btns");
    calc.appendChild(res); calc.appendChild(act);
    stubCells.push({inc:inc,res:res,act:act});
    b.appendChild(calc);

    if(idx===0) b.appendChild(el("p","muted foot","Your pay dates set the rhythm for everything else."));
    card.appendChild(b);
  });
  card.appendChild(btn("add","Add another income",function(){
    state.incomes.push({id:uid(),name:"Second income",baseline:0,low:0,cadence:"biweekly",firstPayDate:toISO(addDays(new Date(),7))});
    touched(); render();
  }));
  m.appendChild(card);

  var test=el("section","card");
  test.appendChild(el("h2",null,"What one check has to cover"));
  var body=el("div"); test.appendChild(body);
  test.appendChild(el("p","muted foot","This updates as you type. If a number below goes red, the fix isn't willpower — it's a smaller monthly commitment somewhere."));
  m.appendChild(test);

  refresh=function(){
    paintStub();
    dateCells.forEach(function(c){
      var ds=upcomingDates(c.inc,4);
      if(!ds.length){
        c.el.textContent = c.inc.cadence==="once"
          ? "That date has already passed, so it won't show in the plan."
          : "No pay dates land in the next year \u2014 check the date above.";
        return;
      }
      c.el.textContent = (c.inc.cadence==="once" ? "Lands once, on " : "Lands on ")
        + ds.map(fmtShort).join(", ")
        + (c.inc.cadence==="once" ? "." : ", and on from there.");
    });
    estCells.forEach(function(c){
      c.el.textContent="A typical check works out to "+money(num(c.inc.dayRate)*num(c.inc.typicalDays))
        +", a light one "+money(num(c.inc.dayRate)*num(c.inc.lowDays))
        +". Use take-home, not gross \u2014 and set the days for each specific check on the Plan tab.";
    });
    body.innerHTML="";
    var t=totals();
    var committed=(t.bills+t.debtMin+num(state.extraDebtMonthly)+t.spend+t.save)*PER_CHECK;
    var GREEN=cssVar("--free"), RED=cssVar("--short");
    var typical=0, low=0;
    state.incomes.forEach(function(x){ typical+=perPeriod(x,"typical"); low+=perPeriod(x,"low"); });
    body.appendChild(lineRow("A typical check",
      state.incomes.length>1?state.incomes.length+" incomes together":"",money(typical)));
    body.appendChild(lineRow("Committed per check","bills, debt, life",money(committed)));
    var gapT=typical-committed;
    body.appendChild(lineRow(gapT>=0?"Left over":"Short by","",money(Math.abs(gapT)),gapT>=0?GREEN:RED,true));
    if(low>0){
      var gapL=low-committed;
      body.appendChild(el("h3",null,"If every check came in slow"));
      body.appendChild(el("p","muted","Testing against "+money(low)+" instead of "+money(typical)+"."));
      body.appendChild(lineRow(gapL>=0?"Still clears, with":"Comes up short by","",money(Math.abs(gapL)),
        gapL>=0?GREEN:RED,true));
    }
  };
  refresh();
}

function renameCategory(oldName,rawName){
  var name=(rawName||"").trim();
  if(!name || name===oldName){ reRender(); return; }
  var at=state.catList.indexOf(oldName), dupe=state.catList.indexOf(name);
  state.bills.forEach(function(b){ if((b.category||"Other")===oldName) b.category=name; });
  if(dupe>=0 && dupe!==at){ if(at>=0) state.catList.splice(at,1); }  /* merged into an existing one */
  else if(at>=0) state.catList[at]=name;
  openCats[name]=true; delete openCats[oldName];
  touched(); reRender();
}
function deleteCategory(name){
  var at=state.catList.indexOf(name);
  var target=state.catList[at-1]||state.catList[at+1];
  if(!target){ alert("This is your only category. Rename it instead of deleting it."); return; }
  var items=state.bills.filter(function(b){ return (b.category||"Other")===name; });
  var msg = items.length
    ? "Delete \""+name+"\"? Its "+items.length+(items.length===1?" bill moves":" bills move")+" to \""+target+"\"."
    : "Delete \""+name+"\"?";
  if(!confirm(msg)) return;
  state.bills.forEach(function(b){ if((b.category||"Other")===name) b.category=target; });
  state.catList=state.catList.filter(function(c){ return c!==name; });
  delete openCats[name];
  touched(); reRender();
}
function moveCategory(name,dir){
  var i=state.catList.indexOf(name), j=i+dir;
  if(i<0||j<0||j>=state.catList.length) return;
  var t=state.catList[i]; state.catList[i]=state.catList[j]; state.catList[j]=t;
  touched(); reRender();
}
function addCategory(){
  var base="New category", name=base, n=2;
  while(state.catList.indexOf(name)>=0) name=base+" "+(n++);
  state.catList.push(name);
  openCats[name]=true;
  touched(); reRender();
}

  refresh=function(){
    slot.innerHTML="";

/* iOS caches a home-screen web app hard. Ask the server what build is live and
   offer a cache-busting reload if it differs from the one running. */
function checkForUpdate(){
  if(!window.fetch || location.protocol==="file:") return;
  var url=location.pathname+"?v="+Date.now();
  fetch(url,{cache:"no-store"}).then(function(r){
    return r.ok ? r.text() : null;
  }).then(function(t){
    if(!t) return;
    var m=t.match(/var BUILD = "([^"]+)"/);
    if(!m || m[1]===BUILD) return;
    var b=document.createElement("button");
    b.className="update";
    b.textContent="Version "+m[1]+" is ready — tap to update";
    b.addEventListener("click",function(){
      location.replace(location.pathname+"?v="+Date.now());
    });
    document.body.insertBefore(b,document.body.firstChild);
  }).catch(function(){});
}

var privacyBtn=document.getElementById("privacyBtn");
function applyPrivacy(){
  privacyBtn.textContent = privateMode?"Show":"Hide";
  document.body.classList[privateMode?"add":"remove"]("hushed");
}
privacyBtn.addEventListener("click",safe(function(){
  privateMode=!privateMode;
  try{ localStorage.setItem("ledger-private",privateMode?"1":"0"); }catch(e){}
  applyPrivacy(); render();
}));
applyPrivacy();

initStorage();
setTimeout(checkForUpdate,2500);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden && !document.querySelector(".update")) checkForUpdate();
});
})();

    const friendly = (code) => ({
      "auth/invalid-email": "That doesn't look like an email address.",
      "auth/invalid-credential": "Wrong email or password.",
      "auth/wrong-password": "Wrong email or password.",
      "auth/user-not-found": "No account for that email. It has to be created in the Firebase console first.",
      "auth/too-many-requests": "Too many tries. Wait a minute and try again.",
      "auth/network-request-failed": "No connection. Try again when you're back online."
    })[code] || ("Sign-in failed (" + code + ").");

    const promptSignIn = (err) => {
      window.Ledger.askSignIn(async (email, pass) => {
        try { await auth.signInWithEmailAndPassword(a, email, pass); }
        catch (e) { promptSignIn(friendly(e.code)); }
      }, err);
    };

    let unsub = null;
    auth.onAuthStateChanged(a, (user) => {
      if (unsub) { unsub(); unsub = null; }
      if (!user) { window.Ledger.detach(); promptSignIn(""); return; }

      let seeded = false;
      unsub = fs.onSnapshot(ref,
        (snap) => {
          if (snap.metadata.hasPendingWrites) return;   // our own write echoing back
          if (snap.exists()) { window.Ledger.applyRemote(snap.data()); seeded = true; }
          else if (!seeded) { seeded = true; fs.setDoc(ref, window.Ledger.getState()); }
        },
        (e) => window.Ledger.status("Sync error: " + e.code, true)
      );

      window.Ledger.attach({
        email: user.email,
        save: (obj) => fs.setDoc(ref, obj)
          .then(() => window.Ledger.status("Synced"))
          .catch((e) => window.Ledger.status("Not synced (" + e.code + ")", true)),
        signOut: () => auth.signOut(a)
      });
    });
  } catch (e) {
    window.Ledger.failed("Cloud sync unavailable: " + (e && e.message ? e.message : e));
  }
}
</script>
</body>
</html>
