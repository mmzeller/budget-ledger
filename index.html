<style>
:root {
  --paper:#F1F4F2; --surface:#FFFFFF;
  --ink:#16231F; --ink-soft:#5B6D66; --ink-faint:#8B9A94;
  --rule:#D8E0DC; --well:#FAFCFB; --track:#E7ECE9;
  --bills:#3E5750; --debt:#A6432F; --life:#C08A2E; --free:#2E8B6B; --short:#8C1D12;
  --alarm-bg:#FBEFEC; --alarm-ink:#5E1A11;
  --inc1:#C08A2E; --inc2:#3E6E8E; --inc3:#7D5BA6; --inc4:#4F7A4A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#101815; --surface:#16211D;
    --ink:#E4EAE7; --ink-soft:#9AAAA4; --ink-faint:#6E827B;
    --rule:#263430; --well:#0D1411; --track:#22302B;
    --bills:#7E9A92; --debt:#D9705A; --life:#E0A94A; --free:#4FBF92; --short:#E06A56;
    --alarm-bg:#2A1713; --alarm-ink:#F0C4BA;
    --inc1:#E0A94A; --inc2:#6FA3C4; --inc3:#B292D6; --inc4:#7FB07A;
  }
}
:root[data-theme="dark"] {
  --paper:#101815; --surface:#16211D;
  --ink:#E4EAE7; --ink-soft:#9AAAA4; --ink-faint:#6E827B;
  --rule:#263430; --well:#0D1411; --track:#22302B;
  --bills:#7E9A92; --debt:#D9705A; --life:#E0A94A; --free:#4FBF92; --short:#E06A56;
  --alarm-bg:#2A1713; --alarm-ink:#F0C4BA;
  --inc1:#E0A94A; --inc2:#6FA3C4; --inc3:#B292D6; --inc4:#7FB07A;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  background:var(--paper); color:var(--ink); min-height:100vh;
  padding-bottom:calc(56px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}
main { max-width:560px; margin:0 auto; padding:16px 14px 0; }

.head { position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top); }
.head-top { max-width:560px; margin:0 auto; padding:12px 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand { display:flex; align-items:center; gap:8px; }
.brand-mark { width:10px; height:18px; border-radius:1px;
  background:linear-gradient(to bottom,var(--bills) 33%,var(--life) 33%,var(--life) 66%,var(--free) 66%); }
.brand-name { font-weight:600; font-size:15px; letter-spacing:-.01em; }
.status { font-size:11px; color:var(--ink-faint); text-align:right; white-space:nowrap; }
.head-right { display:flex; align-items:center; gap:8px; flex:none; }
button.ghost { font:inherit; font-size:12px; font-weight:500; background:none;
  border:1px solid var(--rule); color:var(--ink-soft); padding:6px 10px;
  border-radius:4px; cursor:pointer; flex:none; }
body.hushed input[inputmode="decimal"], body.hushed input[inputmode="numeric"] {
  -webkit-text-security:disc; text-security:disc; }
.status.bad { color:var(--short); font-weight:600; }
.tabs { max-width:560px; margin:0 auto; display:flex; gap:2px; padding:0 8px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { font:inherit; font-size:14px; font-weight:500; background:none; border:none; cursor:pointer;
  color:var(--ink-faint); padding:8px 10px 10px; border-bottom:2px solid transparent; white-space:nowrap; }
.tab.on { color:var(--ink); border-bottom-color:var(--ink); }
:focus-visible { outline:2px solid var(--free); outline-offset:2px; }

.hero { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:20px 16px 16px; margin-bottom:14px; }
.hero-when { font-size:12px; color:var(--ink-soft); font-weight:500; }
.hero-amt { font-size:40px; font-weight:700; letter-spacing:-.03em; line-height:1.05; margin:4px 0 2px; }
.hero-note { font-size:12px; color:var(--ink-faint); margin-bottom:16px; }
.bar { display:flex; height:12px; border-radius:2px; overflow:hidden; background:var(--track); gap:1px; }
.bar-seg { min-width:2px; }
.legend { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:14px; }
.legend-item { display:flex; align-items:center; gap:6px; font-size:12px; }
.dot { width:7px; height:7px; border-radius:2px; flex:none; }
.legend-label { color:var(--ink-soft); }
.legend-val { margin-left:auto; font-weight:600; }
.alarm { margin-top:14px; padding:10px 12px; background:var(--alarm-bg); border-left:3px solid var(--short);
  border-radius:0 4px 4px 0; font-size:13px; line-height:1.5; color:var(--alarm-ink); }

.card { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:16px; margin-bottom:14px; }
.card.quiet { background:none; border:none; padding:0; }
.card h2 { font-size:15px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
.card h3 { font-size:13px; font-weight:600; color:var(--ink-soft); margin:20px 0 6px; padding-bottom:6px; border-bottom:1px solid var(--rule); }
.muted { font-size:13px; line-height:1.55; color:var(--ink-soft); margin:0 0 12px; }
.muted.foot { margin:10px 0 0; font-size:12px; color:var(--ink-faint); }
.empty { background:var(--surface); border:1px dashed var(--rule); border-radius:6px; padding:24px 18px;
  font-size:13px; line-height:1.55; color:var(--ink-soft); text-align:center; }

.line { display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--rule); font-size:14px; }
.line:last-child { border-bottom:none; }
.line-name { flex:1; min-width:0; }
.line-when { font-size:11px; color:var(--ink-faint); white-space:nowrap; }
.line-amt { font-weight:600; white-space:nowrap; }
.line.total { border-bottom:none; border-top:2px solid var(--ink); margin-top:4px; padding-top:10px; font-weight:600; }

.row { display:flex; align-items:center; gap:6px; padding:5px 0; }
.row-body { flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
.row label { flex:1; font-size:14px; color:var(--ink-soft); }
.block { padding:10px 0; border-bottom:1px solid var(--rule); }
.block:last-of-type { border-bottom:none; }
input, select { font:inherit; font-size:16px; font-variant-numeric:tabular-nums; background:var(--well);
  border:1px solid var(--rule); border-radius:4px; color:var(--ink); padding:8px 9px; min-width:0; }
input:focus, select:focus { outline:none; border-color:var(--ink-soft); background:var(--surface); }
input.text { flex:1; font-size:15px; }
input.day { width:48px; text-align:center; }
select.sel, input.date { flex:1; font-size:15px; }
.mi { position:relative; display:flex; align-items:center; width:110px; flex:none; }
.mi-sign { position:absolute; left:9px; font-size:13px; color:var(--ink-faint); pointer-events:none; }
.mi input { width:100%; padding-left:20px; font-weight:600; text-align:right; }
.pct { position:relative; display:flex; align-items:center; width:70px; flex:none; }
.pct input { width:100%; text-align:right; padding-right:20px; }
.pct-sign { position:absolute; right:8px; font-size:13px; color:var(--ink-faint); }
.del { font:inherit; font-size:22px; line-height:1; background:none; border:none; color:var(--ink-faint);
  cursor:pointer; padding:4px 8px; flex:none; }
.add { font:inherit; font-size:13px; font-weight:500; background:none; border:1px dashed var(--rule);
  border-radius:4px; color:var(--ink-soft); padding:11px; width:100%; cursor:pointer; margin-top:8px; }
.action { font:inherit; font-size:14px; font-weight:500; background:var(--well); border:1px solid var(--rule);
  border-radius:4px; color:var(--ink); padding:12px; width:100%; cursor:pointer; margin-bottom:8px; }
.action:hover { border-color:var(--ink-soft); }

.tl-row { display:flex; align-items:center; gap:10px; padding:3px 0; border-bottom:1px solid var(--rule); }
.tl-row:last-child { border-bottom:none; }
.tl-date { width:86px; font-size:13px; color:var(--ink-soft); flex:none; display:flex; align-items:center; gap:5px; }
.tl-in { flex:1; display:flex; }
.tl-multi { font-size:14px; font-weight:600; padding:8px 0; }
.tl-out { width:72px; text-align:right; font-size:14px; font-weight:600; flex:none; }
.tl-in { min-width:0; }
.tl-in .mi { width:96px; }

.cat { border:1px solid var(--rule); border-radius:6px; margin-bottom:9px; overflow:hidden; }
.cat-head { display:flex; align-items:center; gap:9px; width:100%; padding:12px 13px;
  background:var(--well); border:none; font:inherit; text-align:left; cursor:pointer; color:var(--ink); }
.cat-name { font-size:14px; font-weight:600; flex:1; min-width:0; overflow-wrap:anywhere; }
.cat-sum { font-size:11px; color:var(--ink-faint); text-align:right; white-space:nowrap; }
.cat-sum b { display:block; font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums; }
.cat-chev { font-size:15px; color:var(--ink-faint); flex:none; transition:transform .15s ease; }
.cat-chev.open { transform:rotate(90deg); }
.cat-body { display:none; padding:0 13px 6px; }
.cat-tools { display:flex; align-items:center; gap:4px; padding:10px 0 9px;
  border-bottom:1px solid var(--rule); }
.cat-tools input { flex:1; min-width:0; font-size:15px; font-weight:600; }
.cat-del { font:inherit; font-size:12px; color:var(--short); background:none;
  border:1px solid var(--rule); border-radius:4px; padding:8px 9px; cursor:pointer; flex:none; }
.cat-del:active { background:var(--track); }
.cat-body.open { display:block; }
.bline { display:flex; align-items:center; gap:9px; padding:8px 0;
  border-bottom:1px solid var(--rule); font-size:14px; }
.bline-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bline.done .bline-name { color:var(--ink-faint); }
.bline-when { font-size:11px; color:var(--ink-faint); white-space:nowrap; }
.bline-amt { font-weight:600; min-width:76px; text-align:right; }
.paidbox { width:24px; height:24px; flex:none; padding:0; cursor:pointer;
  border:1.5px solid var(--rule); border-radius:5px; background:var(--well);
  font:inherit; font-size:14px; line-height:1; color:transparent; }
.paidbox.on { background:var(--free); border-color:var(--free); color:#fff; }
.tally { display:flex; gap:8px; align-items:baseline; padding:9px 0 2px; font-size:12px; color:var(--ink-soft); }
.tally-var { margin-left:auto; font-weight:600; }
.hrow { display:flex; align-items:baseline; gap:8px; padding:7px 0;
  border-bottom:1px solid var(--rule); font-size:13px; }
.hrow:last-child { border-bottom:none; }

/* the next few dates this income actually lands on */
function upcomingDates(inc,n){
  var today=sod(new Date());
  return incomeEvents(inc,today,addDays(today,430)).slice(0,n||4);
}
function totals(){
  var bills=state.bills.reduce(function(s,b){return s+monthlyEquiv(b);},0);
  var debtMin=state.debts.reduce(function(s,d){return s+num(d.minimum);},0);
  var debtBal=state.debts.reduce(function(s,d){return s+num(d.balance);},0);
  var spend=state.life.filter(function(l){return l.kind!=="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  var save=state.life.filter(function(l){return l.kind==="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  return {bills:bills,debtMin:debtMin,debtBal:debtBal,spend:spend,save:save,
    out:bills+debtMin+num(state.extraDebtMonthly)+spend+save};
}
function simulate(extraMonthly,strategy){
  var act=[];
  state.debts.forEach(function(d,i){
    if(num(d.balance)>0) act.push({id:d.id,balance:num(d.balance),apr:num(d.apr),
                                   minimum:num(d.minimum),rank:i});
  });
  if(!act.length) return null;
  var month=0, interest=0, payoff={}, MAX=600;
  while(act.some(function(d){return d.balance>0.01;}) && month<MAX){
    month++;
    act.forEach(function(d){ if(d.balance>0.01){ var i=d.balance*(d.apr/100/12); d.balance+=i; interest+=i; } });
    var pool=extraMonthly;
    act.forEach(function(d){
      if(d.balance>0.01) d.balance-=Math.min(d.minimum,d.balance);
      else pool+=d.minimum;
    });
    var order=act.filter(function(d){return d.balance>0.01;}).sort(function(a,b){
      if(strategy==="avalanche") return b.apr-a.apr;
      if(strategy==="snowball") return a.balance-b.balance;
      return a.rank-b.rank;                       // the order you arranged them in
    });
    for(var j=0;j<order.length&&pool>0.01;j++){
      var pay=Math.min(pool,order[j].balance); order[j].balance-=pay; pool-=pay;
    }
    act.forEach(function(d){ if(d.balance<=0.01&&!payoff[d.id]){ payoff[d.id]=month; d.balance=0; } });
  }
  return {months:month,interest:interest,payoff:payoff,stalled:month>=MAX};
}

/* ===================== storage (verified) ===================== */
var docRef=null, saveTimer=null, writing=false, pendingWrite=false;
var lsOK=false, store="none";

function probeLocal(){
  try{
    var k="__probe"+Date.now();
    localStorage.setItem(k,"1");
    var ok=localStorage.getItem(k)==="1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}
function storeLabel(){
  if(store==="cloud") return "Synced";
  if(store==="db") return "Saved to your Claude account";
  if(store==="local") return "Saved on this device";
  return "Not saving";
}
function setStatus(t,bad){
  var s=document.getElementById("status");
  s.textContent=t; s.className="status"+(bad?" bad":"");
}
function idle(){ setStatus(storeLabel(), store==="none"); }
function cacheLocal(){
  if(!lsOK) return false;
  try{ localStorage.setItem(LS,JSON.stringify(state)); return true; }
  catch(e){ lsOK=false; if(store==="local") store="none"; return false; }
}
function touched(){
  cacheLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,800);
}
function flush(){
  if(cloud){ cloud.save(snapshotState()); return; }
  if(!docRef){ idle(); return; }
  if(writing){ pendingWrite=true; return; }
  writing=true;
  docRef.set(JSON.parse(JSON.stringify(state))).then(function(){
    store="db"; idle(); writing=false;
    if(pendingWrite){ pendingWrite=false; flush(); }
  }).catch(function(){
    docRef=null; store=lsOK?"local":"none"; idle(); writing=false; pendingWrite=false;
  });
}
function initStorage(){
  lsOK=probeLocal();
  if(lsOK){
    store="local";
    try{ var raw=localStorage.getItem(LS); if(raw) state=normalize(JSON.parse(raw)); }catch(e){}
  }
  var cfg=window.FIREBASE_CONFIG;
  if(cfg && cfg.projectId){ gate="loading"; render(); return; }

  render(); idle();

  if(!(window.claude && typeof window.claude.use==="function")) return;
  window.claude.use("db").then(function(db){
    if(!db) return;
    var ref=db.doc("budget/main");
    return ref.get().then(function(snap){
      docRef=ref; store="db";
      if(snap && snap.exists){
        var r=snap.data();
        if(r && Object.keys(r).length){ state=normalize(r); cacheLocal(); render(); }
        idle();
      } else flush();
    });
  }).catch(function(){ docRef=null; });
}

/* ===================== files ===================== */
function saveFile(filename,data,mime){
  if(window.claude && typeof window.claude.use==="function"){
    return window.claude.use("downloads").then(function(dl){
      if(!dl) return blobSave(filename,data,mime);
      return dl.save({filename:filename,data:data}).then(function(){
        setStatus("Saved file"); setTimeout(idle,2000);
      }).catch(function(e){
        if(e && e.code==="declined"){ idle(); return; }
        blobSave(filename,data,mime);
      });
    }).catch(function(){ blobSave(filename,data,mime); });
  }
  return Promise.resolve(blobSave(filename,data,mime));
}
function blobSave(filename,data,mime){
  try{
    var blob=new Blob([data],{type:mime});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },4000);
    setStatus("Saved file"); setTimeout(idle,2000);
  }catch(e){ setStatus("Could not save file",true); setTimeout(idle,3000); }
}
var xlsxPromise=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxPromise) return xlsxPromise;
  xlsxPromise=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=XLSX_URL;
    s.onload=function(){ window.XLSX?res(window.XLSX):rej(new Error("load")); };
    s.onerror=function(){ xlsxPromise=null; rej(new Error("offline")); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
function buildWorkbook(X){
  var t=totals(), periods=buildPeriods(), plan=simulate(num(state.extraDebtMonthly),state.strategy);
  var wb=X.utils.book_new();
  function sheet(rows,name){ X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),name); }
  sheet([["Paycheck ledger"],["Generated",new Date().toLocaleDateString()],[],
    ["Checking",num(state.checking)],["Savings",num(state.savings)],[],
    ["Monthly bills",t.bills],["Debt minimums",t.debtMin],["Extra to debt",num(state.extraDebtMonthly)],
    ["Spending money",t.spend],["Saving up",t.save],["Total monthly out",t.out],[],
    ["Per paycheck (x12/26)",t.out*PER_CHECK]],"Overview");
  sheet([["Bill","Amount","Due day"]].concat(state.bills.map(function(b){
    return [b.name,num(b.amount),num(b.dueDay)];})),"Bills");
  sheet([["Debt","Balance","APR %","Minimum","Cleared in (months)"]].concat(state.debts.map(function(d){
    return [d.name,num(d.balance),num(d.apr),num(d.minimum),(plan&&plan.payoff[d.id])||""];})),"Debts");
  sheet([["Category","Type","Monthly","Per paycheck","Goal","Saved"]].concat(state.life.map(function(l){
    return [l.name,l.kind==="save"?"Saving up":"Spending",num(l.monthly),num(l.monthly)*PER_CHECK,
            l.kind==="save"?num(l.target):"",l.kind==="save"?num(l.saved):""];})),"Life");
  sheet([["Pay date","Income","Bills due","Debt","Spending","Saving","Left over"]].concat(periods.map(function(p){
    return [toISO(p.start),p.income,p.billTotal,p.debt,p.spend,p.save,p.free];})),"Paycheck plan");
  var incRows=[["Pay period","Income","Paid on","Days","Amount"]];
  periods.forEach(function(p){
    p.sources.forEach(function(src){
      var i0=state.incomes.filter(function(x){return x.id===src.incomeId;})[0];
      incRows.push([toISO(p.start), i0?i0.name:"", toISO(src.date),
                    src.daily?src.days:"", src.amount]);
    });
  });
  sheet(incRows,"Income detail");

  var detail=[["Pay date","Bill","Due","Planned","Paid","Variance"]];
  buildHistory(6).reverse().concat(periods).forEach(function(p){
    p.bills.forEach(function(b){
      detail.push([toISO(p.start),b.name,toISO(b.date),b.amount,
                   b.paid?b.actual:"", b.paid?(b.actual-b.amount):""]);
    });
  });
  sheet(detail,"Bills by check");
  return wb;
}
function doExport(){
  setStatus("Building workbook…");
  loadXLSX().then(function(X){
    var buf=X.write(buildWorkbook(X),{bookType:"xlsx",type:"array"});
    return saveFile("paycheck-ledger.xlsx",buf,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }).catch(function(){
    setStatus("Excel export needs a connection",true); setTimeout(idle,3000);
  });
}
function doBackup(){
  saveFile("ledger-backup-"+toISO(new Date())+".json", JSON.stringify(state,null,2), "application/json");
}
function doRestore(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      state=normalize(JSON.parse(r.result));
      cacheLocal(); flush(); render();
      setStatus("Restored"); setTimeout(idle,2500);
    }catch(e){ setStatus("That file isn't a backup",true); setTimeout(idle,3000); }
  };
  r.onerror=function(){ setStatus("Couldn't read that file",true); setTimeout(idle,3000); };
  r.readAsText(file);
}

/* swap an item with its neighbour, counting only items of the same kind so the
   two Life lists reorder independently inside one array */
function moveItem(listKey,id,dir,peer){
  var arr=state[listKey], peers=[], here=-1;
  for(var i=0;i<arr.length;i++) if(!peer||peer(arr[i])) peers.push(i);
  for(var j=0;j<peers.length;j++) if(arr[peers[j]].id===id) here=j;
  if(here<0) return false;
  var there=here+dir;
  if(there<0||there>=peers.length) return false;
  var a=peers[here], b=peers[there], tmp=arr[a];
  arr[a]=arr[b]; arr[b]=tmp;
  return true;
}
function reRender(){
  var y=window.scrollY||window.pageYOffset||0;
  render();
  window.scrollTo(0,y);
}
function moveHandler(listKey,id,dir,peer){
  return function(){ if(moveItem(listKey,id,dir,peer)){ touched(); reRender(); } };
}

var cloud=null, gate=null, gateErr="", gateBusy=false, remotePending=null;
function snapshotState(){ return JSON.parse(JSON.stringify(state)); }
function isEditing(){
  var a=document.activeElement;

}
document.addEventListener("blur",function(){
  if(remotePending && !isEditing()){

  }
},true);

window.Ledger={
  build:BUILD,
  getState:snapshotState,
  /* a change from the other phone — never stomp on a field being typed in */
  applyRemote:function(obj){
    if(isEditing()){ remotePending=obj; return; }

  },
  attach:function(c){ cloud=c; gate=null; store="cloud"; render(); idle(); },
  detach:function(){ cloud=null; store=lsOK?"local":"none"; },

function renameCategory(oldName,rawName){
  var name=(rawName||"").trim();
  if(!name || name===oldName){ reRender(); return; }
  var at=state.catList.indexOf(oldName), dupe=state.catList.indexOf(name);
  state.bills.forEach(function(b){ if((b.category||"Other")===oldName) b.category=name; });
  if(dupe>=0 && dupe!==at){ if(at>=0) state.catList.splice(at,1); }  /* merged into an existing one */
  else if(at>=0) state.catList[at]=name;
  openCats[name]=true; delete openCats[oldName];
  touched(); reRender();
}
function deleteCategory(name){
  var at=state.catList.indexOf(name);
  var target=state.catList[at-1]||state.catList[at+1];
  if(!target){ alert("This is your only category. Rename it instead of deleting it."); return; }
  var items=state.bills.filter(function(b){ return (b.category||"Other")===name; });
  var msg = items.length
    ? "Delete \""+name+"\"? Its "+items.length+(items.length===1?" bill moves":" bills move")+" to \""+target+"\"."
    : "Delete \""+name+"\"?";
  if(!confirm(msg)) return;
  state.bills.forEach(function(b){ if((b.category||"Other")===name) b.category=target; });
  state.catList=state.catList.filter(function(c){ return c!==name; });
  delete openCats[name];
  touched(); reRender();
}
function moveCategory(name,dir){
  var i=state.catList.indexOf(name), j=i+dir;
  if(i<0||j<0||j>=state.catList.length) return;
  var t=state.catList[i]; state.catList[i]=state.catList[j]; state.catList[j]=t;
  touched(); reRender();
}
function addCategory(){
  var base="New category", name=base, n=2;
  while(state.catList.indexOf(name)>=0) name=base+" "+(n++);
  state.catList.push(name);
  openCats[name]=true;
  touched(); reRender();
}

    });

    }));

}

  card.appendChild(el("h3",null,"Saving up for"));

  var potItems=state.life.filter(isSave);

      {canUp:pi2>0, canDown:pi2<potItems.length-1,

    var prog=el("div","prog"), fill=el("div","prog-fill"), note=el("div","pot-note");

  card.appendChild(btn("add","Add something to save for",function(){

  var slot=el("div"); card.appendChild(slot); m.appendChild(card);

  refresh=function(){
    perCells.forEach(function(c){ c.el.textContent=money0(num(c.item.monthly)*PER_CHECK); });
    pots.forEach(function(p){
      var l=p.item, perCheck=num(l.monthly)*PER_CHECK;
      p.per.textContent=money0(perCheck);
      var target=num(l.target), saved=num(l.saved), remaining=Math.max(0,target-saved);
      if(target>0){
        p.prog.style.display=""; p.note.style.display="";
        p.fill.style.width=Math.min(100,(saved/target)*100)+"%";
        if(remaining<=0) p.note.textContent="Funded. Go spend it.";

          p.note.textContent=money0(remaining)+" to go — about "+c+" paycheck"+(c===1?"":"s")+"."; }

       {label:"Rate",control:pct},
       {label:"Minimum",control:moneyInput(function(){return num(d.minimum);},function(v){d.minimum=v;},110)}],

    moneyInput(function(){return num(state.extraDebtMonthly);},function(v){state.extraDebtMonthly=v;})]));
  var stratSel=document.createElement("select"); stratSel.className="sel";
  [["avalanche","Highest rate first"],["snowball","Smallest balance first"],
   ["manual","My own order, top of the list first"]].forEach(function(o){
    var op=document.createElement("option"); op.value=o[0]; op.textContent=o[1]; stratSel.appendChild(op);
  });
  stratSel.value=state.strategy;
  stratSel.addEventListener("change",safe(function(){ state.strategy=stratSel.value; touched(); render(); }));

    state.strategy==="avalanche"
      ? "Costs you the least. Whatever carries the highest rate goes first."
    : state.strategy==="snowball"
      ? "Costs a bit more in interest, but you clear a whole debt sooner — which is the thing that actually keeps people going."
      : "Follows the order you arranged above — use the arrows on each debt to change it. Worth the extra interest when there's a debt you want gone for reasons that aren't arithmetic."));
  var slot=el("div"); push.appendChild(slot); m.appendChild(push);

  refresh=function(){
    slot.innerHTML="";
    var extra=num(state.extraDebtMonthly);
    var plan=simulate(extra,state.strategy), minOnly=simulate(0,state.strategy);
    if(!plan){ slot.appendChild(el("div","empty","Put in a balance and a minimum to see how this ends.")); return; }
    if(plan.stalled){ slot.appendChild(el("div","alarm","At these minimums the balances never clear — the interest outruns the payments. Even a small extra amount changes that.")); return; }
    var res=el("div","result"), big=el("div","result-big");
    big.appendChild(document.createTextNode(Math.floor(plan.months/12)));
    big.appendChild(el("span","unit","y"));
    big.appendChild(document.createTextNode(plan.months%12));
    big.appendChild(el("span","unit","m"));
    res.appendChild(big);
    res.appendChild(el("div","result-note","Debt free around "+monthYear(plan.months)));
    slot.appendChild(res);
    slot.appendChild(lineRow("Interest you'll pay","",money(plan.interest)));
    if(minOnly && !minOnly.stalled && extra>0)
      slot.appendChild(lineRow("Saved by paying extra",(minOnly.months-plan.months)+" months sooner",
        money(minOnly.interest-plan.interest),cssVar("--free")));
    slot.appendChild(el("h3",null,"Order they fall"));
    state.debts.filter(function(d){return num(d.balance)>0;})
      .sort(function(a,b){ return (plan.payoff[a.id]||999)-(plan.payoff[b.id]||999); })
      .forEach(function(d){
        slot.appendChild(lineRow(d.name, plan.payoff[d.id]?monthShort(plan.payoff[d.id]):"—", money(num(d.balance))));
      });
  };
  refresh();
}

/* iOS caches a home-screen web app hard. Ask the server what build is live and
   offer a cache-busting reload if it differs from the one running. */
function checkForUpdate(){
  if(!window.fetch || location.protocol==="file:") return;
  var url=location.pathname+"?v="+Date.now();
  fetch(url,{cache:"no-store"}).then(function(r){
    return r.ok ? r.text() : null;
  }).then(function(t){
    if(!t) return;
    var m=t.match(/var BUILD = "([^"]+)"/);
    if(!m || m[1]===BUILD) return;
    var b=document.createElement("button");
    b.className="update";
    b.textContent="Version "+m[1]+" is ready — tap to update";
    b.addEventListener("click",function(){
      location.replace(location.pathname+"?v="+Date.now());
    });
    document.body.insertBefore(b,document.body.firstChild);
  }).catch(function(){});
}

var privacyBtn=document.getElementById("privacyBtn");
function applyPrivacy(){
  privacyBtn.textContent = privateMode?"Show":"Hide";
  document.body.classList[privateMode?"add":"remove"]("hushed");
}
privacyBtn.addEventListener("click",safe(function(){
  privateMode=!privateMode;
  try{ localStorage.setItem("ledger-private",privateMode?"1":"0"); }catch(e){}
  applyPrivacy(); render();
}));
applyPrivacy();

initStorage();
setTimeout(checkForUpdate,2500);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden && !document.querySelector(".update")) checkForUpdate();
});
})();
</script>

<script type="module">
/* Optional shared-household layer. Inert unless FIREBASE_CONFIG is filled in. */
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.projectId) {
  const V = "12.17.1";
  const cdn = "https://www.gstatic.com/firebasejs/" + V + "/";
  try {
    const [core, auth, fs] = await Promise.all([
      import(cdn + "firebase-app.js"),
      import(cdn + "firebase-auth.js"),
      import(cdn + "firebase-firestore.js")
    ]);

    const app = core.initializeApp(cfg);
    const a = auth.getAuth(app);
    await auth.setPersistence(a, auth.browserLocalPersistence);

    let db;
    try {
      db = fs.initializeFirestore(app, {
        localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
      });
    } catch (e) {
      db = fs.getFirestore(app);   // private browsing blocks the cache; memory is fine
    }
    const ref = fs.doc(db, "budgets", "household");

    const friendly = (code) => ({
      "auth/invalid-email": "That doesn't look like an email address.",
      "auth/invalid-credential": "Wrong email or password.",
      "auth/wrong-password": "Wrong email or password.",
      "auth/user-not-found": "No account for that email. It has to be created in the Firebase console first.",
      "auth/too-many-requests": "Too many tries. Wait a minute and try again.",
      "auth/network-request-failed": "No connection. Try again when you're back online."
    })[code] || ("Sign-in failed (" + code + ").");

    const promptSignIn = (err) => {
      window.Ledger.askSignIn(async (email, pass) => {
        try { await auth.signInWithEmailAndPassword(a, email, pass); }
        catch (e) { promptSignIn(friendly(e.code)); }
      }, err);
    };

    let unsub = null;
    auth.onAuthStateChanged(a, (user) => {
      if (unsub) { unsub(); unsub = null; }
      if (!user) { window.Ledger.detach(); promptSignIn(""); return; }

      let seeded = false;
      unsub = fs.onSnapshot(ref,
        (snap) => {
          if (snap.metadata.hasPendingWrites) return;   // our own write echoing back
          if (snap.exists()) { window.Ledger.applyRemote(snap.data()); seeded = true; }
          else if (!seeded) { seeded = true; fs.setDoc(ref, window.Ledger.getState()); }
        },
        (e) => window.Ledger.status("Sync error: " + e.code, true)
      );

      window.Ledger.attach({
        email: user.email,
        save: (obj) => fs.setDoc(ref, obj)
          .then(() => window.Ledger.status("Synced"))
          .catch((e) => window.Ledger.status("Not synced (" + e.code + ")", true)),
        signOut: () => auth.signOut(a)
      });
    });
  } catch (e) {
    window.Ledger.failed("Cloud sync unavailable: " + (e && e.message ? e.message : e));
  }
}
</script>
