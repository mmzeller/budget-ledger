<style>
:root {
  --paper:#F1F4F2; --surface:#FFFFFF;
  --ink:#16231F; --ink-soft:#5B6D66; --ink-faint:#8B9A94;
  --rule:#D8E0DC; --well:#FAFCFB; --track:#E7ECE9;
  --bills:#3E5750; --debt:#A6432F; --life:#C08A2E; --free:#2E8B6B; --short:#8C1D12;
  --alarm-bg:#FBEFEC; --alarm-ink:#5E1A11;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#101815; --surface:#16211D;
    --ink:#E4EAE7; --ink-soft:#9AAAA4; --ink-faint:#6E827B;
    --rule:#263430; --well:#0D1411; --track:#22302B;
    --bills:#7E9A92; --debt:#D9705A; --life:#E0A94A; --free:#4FBF92; --short:#E06A56;
    --alarm-bg:#2A1713; --alarm-ink:#F0C4BA;
  }
}
:root[data-theme="dark"] {
  --paper:#101815; --surface:#16211D;
  --ink:#E4EAE7; --ink-soft:#9AAAA4; --ink-faint:#6E827B;
  --rule:#263430; --well:#0D1411; --track:#22302B;
  --bills:#7E9A92; --debt:#D9705A; --life:#E0A94A; --free:#4FBF92; --short:#E06A56;
  --alarm-bg:#2A1713; --alarm-ink:#F0C4BA;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  background:var(--paper); color:var(--ink); min-height:100vh;
  padding-bottom:calc(56px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}
main { max-width:560px; margin:0 auto; padding:16px 14px 0; }

.head { position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top); }
.head-top { max-width:560px; margin:0 auto; padding:12px 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand { display:flex; align-items:center; gap:8px; }
.brand-mark { width:10px; height:18px; border-radius:1px;
  background:linear-gradient(to bottom,var(--bills) 33%,var(--life) 33%,var(--life) 66%,var(--free) 66%); }
.brand-name { font-weight:600; font-size:15px; letter-spacing:-.01em; }
.status { font-size:11px; color:var(--ink-faint); text-align:right; white-space:nowrap; }
.status.bad { color:var(--short); font-weight:600; }
.tabs { max-width:560px; margin:0 auto; display:flex; gap:2px; padding:0 8px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { font:inherit; font-size:14px; font-weight:500; background:none; border:none; cursor:pointer;
  color:var(--ink-faint); padding:8px 10px 10px; border-bottom:2px solid transparent; white-space:nowrap; }
.tab.on { color:var(--ink); border-bottom-color:var(--ink); }
:focus-visible { outline:2px solid var(--free); outline-offset:2px; }

.hero { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:20px 16px 16px; margin-bottom:14px; }
.hero-when { font-size:12px; color:var(--ink-soft); font-weight:500; }
.hero-amt { font-size:40px; font-weight:700; letter-spacing:-.03em; line-height:1.05; margin:4px 0 2px; }
.hero-note { font-size:12px; color:var(--ink-faint); margin-bottom:16px; }
.bar { display:flex; height:12px; border-radius:2px; overflow:hidden; background:var(--track); gap:1px; }
.bar-seg { min-width:2px; }
.legend { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:14px; }
.legend-item { display:flex; align-items:center; gap:6px; font-size:12px; }
.dot { width:7px; height:7px; border-radius:2px; flex:none; }
.legend-label { color:var(--ink-soft); }
.legend-val { margin-left:auto; font-weight:600; }
.alarm { margin-top:14px; padding:10px 12px; background:var(--alarm-bg); border-left:3px solid var(--short);
  border-radius:0 4px 4px 0; font-size:13px; line-height:1.5; color:var(--alarm-ink); }

.card { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:16px; margin-bottom:14px; }
.card.quiet { background:none; border:none; padding:0; }
.card h2 { font-size:15px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
.card h3 { font-size:13px; font-weight:600; color:var(--ink-soft); margin:20px 0 6px; padding-bottom:6px; border-bottom:1px solid var(--rule); }
.muted { font-size:13px; line-height:1.55; color:var(--ink-soft); margin:0 0 12px; }
.muted.foot { margin:10px 0 0; font-size:12px; color:var(--ink-faint); }
.empty { background:var(--surface); border:1px dashed var(--rule); border-radius:6px; padding:24px 18px;
  font-size:13px; line-height:1.55; color:var(--ink-soft); text-align:center; }

.line { display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--rule); font-size:14px; }
.line:last-child { border-bottom:none; }
.line-name { flex:1; min-width:0; }
.line-when { font-size:11px; color:var(--ink-faint); white-space:nowrap; }
.line-amt { font-weight:600; white-space:nowrap; }
.line.total { border-bottom:none; border-top:2px solid var(--ink); margin-top:4px; padding-top:10px; font-weight:600; }

.hdr { display:flex; gap:8px; font-size:11px; color:var(--ink-faint); padding:0 28px 6px 0;
  border-bottom:1px solid var(--rule); margin-bottom:2px; }
.hdr span:first-child { flex:1; }
.hdr .r { width:100px; text-align:right; }
.row { display:flex; align-items:center; gap:6px; padding:5px 0; }
.row-body { flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
.row label { flex:1; font-size:14px; color:var(--ink-soft); }
.block { padding:10px 0; border-bottom:1px solid var(--rule); }
.block:last-of-type { border-bottom:none; }
input, select { font:inherit; font-size:16px; font-variant-numeric:tabular-nums; background:var(--well);
  border:1px solid var(--rule); border-radius:4px; color:var(--ink); padding:8px 9px; min-width:0; }
input:focus, select:focus { outline:none; border-color:var(--ink-soft); background:var(--surface); }
input.text { flex:1; font-size:15px; }
input.day { width:48px; text-align:center; }
select.sel, input.date { flex:1; font-size:15px; }
.mi { position:relative; display:flex; align-items:center; width:110px; flex:none; }
.mi-sign { position:absolute; left:9px; font-size:13px; color:var(--ink-faint); pointer-events:none; }
.mi input { width:100%; padding-left:20px; font-weight:600; text-align:right; }
.pct { position:relative; display:flex; align-items:center; width:70px; flex:none; }
.pct input { width:100%; text-align:right; padding-right:20px; }
.pct-sign { position:absolute; right:8px; font-size:13px; color:var(--ink-faint); }
.per { width:56px; text-align:right; font-size:12px; color:var(--ink-faint); flex:none; }
.del { font:inherit; font-size:22px; line-height:1; background:none; border:none; color:var(--ink-faint);
  cursor:pointer; padding:4px 8px; flex:none; }
.add { font:inherit; font-size:13px; font-weight:500; background:none; border:1px dashed var(--rule);
  border-radius:4px; color:var(--ink-soft); padding:11px; width:100%; cursor:pointer; margin-top:8px; }
.action { font:inherit; font-size:14px; font-weight:500; background:var(--well); border:1px solid var(--rule);
  border-radius:4px; color:var(--ink); padding:12px; width:100%; cursor:pointer; margin-bottom:8px; }
.action:hover { border-color:var(--ink-soft); }

.tl-row { display:flex; align-items:center; gap:10px; padding:3px 0; border-bottom:1px solid var(--rule); }
.tl-row:last-child { border-bottom:none; }
.tl-date { width:78px; font-size:13px; color:var(--ink-soft); flex:none; display:flex; align-items:center; gap:5px; }
.pip { width:5px; height:5px; border-radius:50%; background:var(--life); flex:none; }
.tl-in { flex:1; display:flex; }
.tl-multi { font-size:14px; font-weight:600; padding:8px 0; }
.tl-out { width:76px; text-align:right; font-size:14px; font-weight:600; flex:none; }

.pot { padding:8px 0 12px; border-bottom:1px solid var(--rule); }
.pot:last-of-type { border-bottom:none; }
.pot-meta { display:flex; align-items:center; gap:6px; padding:2px 0 8px; flex-wrap:wrap; }
.pot-lab { font-size:11px; color:var(--ink-faint); }
.prog { height:5px; background:var(--track); border-radius:3px; overflow:hidden; }
.prog-fill { height:100%; background:var(--life); transition:width .25s ease; }
.pot-note { font-size:12px; color:var(--ink-soft); margin-top:6px; }

.seg { display:flex; gap:6px; margin:10px 0 12px; }
.seg-btn { font:inherit; font-size:13px; font-weight:500; flex:1; background:var(--well);
  border:1px solid var(--rule); border-radius:4px; color:var(--ink-soft); padding:11px 6px; cursor:pointer; }
.seg-btn.on { background:var(--ink); border-color:var(--ink); color:var(--paper); }
.result { padding:16px 0 14px; border-top:2px solid var(--ink); border-bottom:1px solid var(--rule); margin-top:8px; }
.result-big { font-size:44px; font-weight:700; letter-spacing:-.03em; line-height:1; color:var(--debt); }
.unit { font-size:20px; font-weight:500; margin:0 8px 0 2px; }
.result-note { font-size:13px; color:var(--ink-soft); margin-top:6px; }
.reset { font:inherit; font-size:12px; background:none; border:none; color:var(--ink-faint);
  text-decoration:underline; cursor:pointer; padding:10px; width:100%; }
.gate { max-width:420px; margin:28px auto; }
.gate h2 { font-size:19px; margin-bottom:6px; }
.field { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.field label { font-size:12px; color:var(--ink-soft); }
.field input { width:100%; }
.primary { font:inherit; font-size:15px; font-weight:600; width:100%; padding:13px;
  background:var(--ink); color:var(--paper); border:1px solid var(--ink); border-radius:4px; cursor:pointer; }
.gate-err { font-size:13px; color:var(--short); margin-top:10px; line-height:1.5; min-height:1px; }
.spin { text-align:center; padding:48px 20px; color:var(--ink-faint); font-size:14px; }
.errline { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; line-height:1.5;
  color:var(--short); padding:6px 0; border-bottom:1px solid var(--rule); word-break:break-word; }
.build { font-size:11px; color:var(--ink-faint); text-align:center; padding:4px 0 20px; }
@media (prefers-reduced-motion:reduce) { *, .prog-fill { transition:none !important; } }
</style>
</head>
<body>
<header class="head">
  <div class="head-top">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Paycheck ledger</span></div>

function money(n){ return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2}).format(isFinite(n)?n:0); }
function money0(n){ return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(isFinite(n)?n:0); }

function sod(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return sod(x); }
function pad2(n){ n=String(n); return n.length<2?"0"+n:n; }
function toISO(d){ var x=new Date(d); return x.getFullYear()+"-"+pad2(x.getMonth()+1)+"-"+pad2(x.getDate()); }

/* ===================== state ===================== */
function seed(){
  var d = sod(new Date());

  return {
    checking:0, savings:0,

    life:[
      {id:uid(),name:"Groceries",kind:"spend",monthly:0},

      {id:uid(),name:"Car repairs",kind:"save",monthly:0,target:0,saved:0}
    ],
    extraDebtMonthly:0, strategy:"avalanche"
  };
}
function normalize(raw){
  var s=seed();
  if(!raw||typeof raw!=="object") return s;
  var o={
    checking:num(raw.checking), savings:num(raw.savings),
    incomes:(Array.isArray(raw.incomes)&&raw.incomes.length)?raw.incomes:s.incomes,
    overrides:(raw.overrides&&typeof raw.overrides==="object")?raw.overrides:{},
    bills:Array.isArray(raw.bills)?raw.bills:s.bills,
    debts:Array.isArray(raw.debts)?raw.debts:s.debts,
    life:Array.isArray(raw.life)?raw.life:s.life,
    extraDebtMonthly:num(raw.extraDebtMonthly),
    strategy:raw.strategy==="snowball"?"snowball":"avalanche"
  };
  [o.incomes,o.bills,o.debts,o.life].forEach(function(arr){ arr.forEach(function(x){ if(!x.id) x.id=uid(); }); });
  return o;
}
var state = seed();

/* ===================== schedule math ===================== */
function primaryPayDates(inc,count){
  var first=fromISO(inc&&inc.firstPayDate); if(!first) return [];
  var today=sod(new Date()), start=first;
  if(first<today){
    var diff=Math.floor((today-first)/86400000);
    start=addDays(first,Math.floor(diff/14)*14);
    if(start<today) start=addDays(start,14);
  }
  var out=[]; for(var i=0;i<count;i++) out.push(addDays(start,i*14));
  return out;
}
function incomeEvents(inc,start,end){
  var out=[], first=fromISO(inc.firstPayDate); if(!first) return out;
  if(inc.cadence==="biweekly"||inc.cadence==="weekly"){
    var step=inc.cadence==="weekly"?7:14, d=first;
    if(d<start){ var diff=Math.floor((start-d)/86400000); d=addDays(d,Math.floor(diff/step)*step); while(d<start) d=addDays(d,step); }
    while(d<end){ out.push(new Date(d)); d=addDays(d,step); }
  } else if(inc.cadence==="monthly"){
    var day=first.getDate(), cur=new Date(start.getFullYear(),start.getMonth(),1);
    while(cur<end){
      var dd=Math.min(day,dim(cur.getFullYear(),cur.getMonth()));
      var x=sod(new Date(cur.getFullYear(),cur.getMonth(),dd));
      if(x>=start&&x<end) out.push(x);
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
  } else if(inc.cadence==="semimonthly"){
    var c=new Date(start.getFullYear(),start.getMonth(),1);
    while(c<end){
      var y=c.getFullYear(), mo=c.getMonth();
      [1,15].forEach(function(dd){ var x=sod(new Date(y,mo,dd)); if(x>=start&&x<end) out.push(x); });
      c=new Date(y,mo+1,1);
    }
  }
  return out;
}
function billOccurrences(b,start,end){
  var out=[], cur=new Date(start.getFullYear(),start.getMonth(),1);
  while(cur<end){
    var y=cur.getFullYear(), m=cur.getMonth();
    var dd=Math.min(Math.max(1,num(b.dueDay)||1),dim(y,m));
    var x=sod(new Date(y,m,dd));
    if(x>=start&&x<end) out.push(x);
    cur=new Date(y,m+1,1);
  }
  return out;
}
function buildPeriods(){
  var dates=primaryPayDates(state.incomes[0],HORIZON+1);
  if(dates.length<2) return [];
  var debtMin=state.debts.reduce(function(s,d){return s+num(d.minimum);},0);
  var extra=num(state.extraDebtMonthly);
  var spendM=state.life.filter(function(l){return l.kind!=="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  var saveM=state.life.filter(function(l){return l.kind==="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  var debtPer=(debtMin+extra)*PER_CHECK, spendPer=spendM*PER_CHECK, savePer=saveM*PER_CHECK;
  var periods=[];
  for(var i=0;i<Math.min(HORIZON,dates.length-1);i++){
    var start=dates[i], end=dates[i+1], income=0, sources=[];
    state.incomes.forEach(function(inc){
      incomeEvents(inc,start,end).forEach(function(d){
        var k=inc.id+"_"+toISO(d);
        var amt=state.overrides[k]!==undefined?num(state.overrides[k]):num(inc.baseline);
        income+=amt; sources.push({incomeId:inc.id,date:d,amount:amt,key:k});
      });
    });
    var hits=[];
    state.bills.forEach(function(b){
      billOccurrences(b,start,end).forEach(function(d){ hits.push({name:b.name,date:d,amount:num(b.amount)}); });
    });
    hits.sort(function(a,b){return a.date-b.date;});
    var billTotal=hits.reduce(function(s,b){return s+b.amount;},0);
    var committed=billTotal+debtPer+spendPer+savePer;
    periods.push({index:i,start:start,end:end,sources:sources,income:income,bills:hits,billTotal:billTotal,
      debt:debtPer,spend:spendPer,save:savePer,free:income-committed,
      monthKey:start.getFullYear()+"-"+start.getMonth()});
  }
  var counts={};
  periods.forEach(function(p){ counts[p.monthKey]=(counts[p.monthKey]||0)+1; });
  periods.forEach(function(p){ p.thirdCheck=counts[p.monthKey]>=3; });
  return periods;
}
function totals(){
  var bills=state.bills.reduce(function(s,b){return s+num(b.amount);},0);
  var debtMin=state.debts.reduce(function(s,d){return s+num(d.minimum);},0);
  var debtBal=state.debts.reduce(function(s,d){return s+num(d.balance);},0);
  var spend=state.life.filter(function(l){return l.kind!=="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  var save=state.life.filter(function(l){return l.kind==="save";}).reduce(function(s,l){return s+num(l.monthly);},0);
  return {bills:bills,debtMin:debtMin,debtBal:debtBal,spend:spend,save:save,
    out:bills+debtMin+num(state.extraDebtMonthly)+spend+save};
}
function simulate(extraMonthly,strategy){
  var act=state.debts.filter(function(d){return num(d.balance)>0;}).map(function(d){
    return {id:d.id,balance:num(d.balance),apr:num(d.apr),minimum:num(d.minimum)};
  });
  if(!act.length) return null;
  var month=0, interest=0, payoff={}, MAX=600;
  while(act.some(function(d){return d.balance>0.01;}) && month<MAX){
    month++;
    act.forEach(function(d){ if(d.balance>0.01){ var i=d.balance*(d.apr/100/12); d.balance+=i; interest+=i; } });
    var pool=extraMonthly;
    act.forEach(function(d){
      if(d.balance>0.01) d.balance-=Math.min(d.minimum,d.balance);
      else pool+=d.minimum;
    });
    var order=act.filter(function(d){return d.balance>0.01;}).sort(function(a,b){
      return strategy==="avalanche" ? b.apr-a.apr : a.balance-b.balance;
    });
    for(var j=0;j<order.length&&pool>0.01;j++){
      var pay=Math.min(pool,order[j].balance); order[j].balance-=pay; pool-=pay;
    }
    act.forEach(function(d){ if(d.balance<=0.01&&!payoff[d.id]){ payoff[d.id]=month; d.balance=0; } });
  }
  return {months:month,interest:interest,payoff:payoff,stalled:month>=MAX};
}

/* ===================== storage (verified) ===================== */
var docRef=null, saveTimer=null, writing=false, pendingWrite=false;
var lsOK=false, store="none";

function probeLocal(){
  try{
    var k="__probe"+Date.now();
    localStorage.setItem(k,"1");
    var ok=localStorage.getItem(k)==="1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}
function storeLabel(){
  if(store==="cloud") return "Synced";
  if(store==="db") return "Saved to your Claude account";
  if(store==="local") return "Saved on this device";
  return "Not saving";
}
function setStatus(t,bad){
  var s=document.getElementById("status");

}
function idle(){ setStatus(storeLabel(), store==="none"); }
function cacheLocal(){
  if(!lsOK) return false;
  try{ localStorage.setItem(LS,JSON.stringify(state)); return true; }
  catch(e){ lsOK=false; if(store==="local") store="none"; return false; }
}
function touched(){
  cacheLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,800);
}
function flush(){
  if(cloud){ cloud.save(snapshotState()); return; }
  if(!docRef){ idle(); return; }
  if(writing){ pendingWrite=true; return; }
  writing=true;
  docRef.set(JSON.parse(JSON.stringify(state))).then(function(){
    store="db"; idle(); writing=false;
    if(pendingWrite){ pendingWrite=false; flush(); }
  }).catch(function(){
    docRef=null; store=lsOK?"local":"none"; idle(); writing=false; pendingWrite=false;
  });
}
function initStorage(){
  lsOK=probeLocal();

    store="local";

  }

  render(); idle();

  if(!(window.claude && typeof window.claude.use==="function")) return;
  window.claude.use("db").then(function(db){
    if(!db) return;
    var ref=db.doc("budget/main");
    return ref.get().then(function(snap){
      docRef=ref; store="db";
      if(snap && snap.exists){
        var r=snap.data();
        if(r && Object.keys(r).length){ state=normalize(r); cacheLocal(); render(); }
        idle();
      } else flush();
    });
  }).catch(function(){ docRef=null; });
}

/* ===================== files ===================== */
function saveFile(filename,data,mime){
  if(window.claude && typeof window.claude.use==="function"){
    return window.claude.use("downloads").then(function(dl){
      if(!dl) return blobSave(filename,data,mime);
      return dl.save({filename:filename,data:data}).then(function(){
        setStatus("Saved file"); setTimeout(idle,2000);
      }).catch(function(e){
        if(e && e.code==="declined"){ idle(); return; }
        blobSave(filename,data,mime);
      });
    }).catch(function(){ blobSave(filename,data,mime); });
  }
  return Promise.resolve(blobSave(filename,data,mime));
}
function blobSave(filename,data,mime){
  try{
    var blob=new Blob([data],{type:mime});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },4000);
    setStatus("Saved file"); setTimeout(idle,2000);
  }catch(e){ setStatus("Could not save file",true); setTimeout(idle,3000); }
}
var xlsxPromise=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxPromise) return xlsxPromise;
  xlsxPromise=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=XLSX_URL;
    s.onload=function(){ window.XLSX?res(window.XLSX):rej(new Error("load")); };
    s.onerror=function(){ xlsxPromise=null; rej(new Error("offline")); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
function buildWorkbook(X){
  var t=totals(), periods=buildPeriods(), plan=simulate(num(state.extraDebtMonthly),state.strategy);
  var wb=X.utils.book_new();
  function sheet(rows,name){ X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),name); }
  sheet([["Paycheck ledger"],["Generated",new Date().toLocaleDateString()],[],
    ["Checking",num(state.checking)],["Savings",num(state.savings)],[],
    ["Monthly bills",t.bills],["Debt minimums",t.debtMin],["Extra to debt",num(state.extraDebtMonthly)],
    ["Spending money",t.spend],["Saving up",t.save],["Total monthly out",t.out],[],
    ["Per paycheck (x12/26)",t.out*PER_CHECK]],"Overview");
  sheet([["Bill","Amount","Due day"]].concat(state.bills.map(function(b){
    return [b.name,num(b.amount),num(b.dueDay)];})),"Bills");
  sheet([["Debt","Balance","APR %","Minimum","Cleared in (months)"]].concat(state.debts.map(function(d){
    return [d.name,num(d.balance),num(d.apr),num(d.minimum),(plan&&plan.payoff[d.id])||""];})),"Debts");
  sheet([["Category","Type","Monthly","Per paycheck","Goal","Saved"]].concat(state.life.map(function(l){
    return [l.name,l.kind==="save"?"Saving up":"Spending",num(l.monthly),num(l.monthly)*PER_CHECK,
            l.kind==="save"?num(l.target):"",l.kind==="save"?num(l.saved):""];})),"Life");
  sheet([["Pay date","Income","Bills due","Debt","Spending","Saving","Left over"]].concat(periods.map(function(p){
    return [toISO(p.start),p.income,p.billTotal,p.debt,p.spend,p.save,p.free];})),"Paycheck plan");
  var detail=[["Pay date","Bill","Due","Amount"]];
  periods.forEach(function(p){ p.bills.forEach(function(b){ detail.push([toISO(p.start),b.name,toISO(b.date),b.amount]); }); });
  sheet(detail,"Bills by check");
  return wb;
}
function doExport(){
  setStatus("Building workbook…");
  loadXLSX().then(function(X){
    var buf=X.write(buildWorkbook(X),{bookType:"xlsx",type:"array"});
    return saveFile("paycheck-ledger.xlsx",buf,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }).catch(function(){
    setStatus("Excel export needs a connection",true); setTimeout(idle,3000);
  });

function doBackup(){

function doRestore(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      state=normalize(JSON.parse(r.result));
      cacheLocal(); flush(); render();
      setStatus("Restored"); setTimeout(idle,2500);
    }catch(e){ setStatus("That file isn't a backup",true); setTimeout(idle,3000); }
  };
  r.onerror=function(){ setStatus("Couldn't read that file",true); setTimeout(idle,3000); };
  r.readAsText(file);
}

/* ===================== cloud bridge ===================== */
var cloud=null, gate=null, gateErr="", gateBusy=false, remotePending=null;

}
document.addEventListener("blur",function(){
  if(remotePending && !isEditing()){

},true);

window.Ledger={
  build:BUILD,
  getState:snapshotState,
  /* a change from the other phone — never stomp on a field being typed in */
  applyRemote:function(obj){
    if(isEditing()){ remotePending=obj; return; }

  },
  attach:function(c){ cloud=c; gate=null; store="cloud"; render(); idle(); },
  detach:function(){ cloud=null; store=lsOK?"local":"none"; },

function renderGate(){

  if(gate==="loading"){ m.appendChild(el("div","spin","Connecting to your household…")); return; }
  var c=el("section","card gate");

  email.placeholder="you@example.com"; f1.appendChild(email); c.appendChild(f1);
  var f2=el("div","field"); f2.appendChild(el("label",null,"Password"));
  var pass=document.createElement("input");

  var errBox=el("div","gate-err",gateErr);
  var go=el("button","primary",gateBusy?"Signing in…":"Sign in");
  function submit(){

  go.addEventListener("click",submit);
  pass.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
  c.appendChild(go); c.appendChild(errBox);
  m.appendChild(c);
}

/* ===================== render ===================== */
var refresh=function(){};
var TABS=[["plan","Plan"],["income","Income"],["bills","Bills"],["life","Life"],["debt","Debt"],["data","Data"]];

function render(){
  if(gate){ renderGate(); return; }
  var nav=document.getElementById("tabs"); nav.style.display=""; nav.innerHTML="";
  TABS.forEach(function(t){
    nav.appendChild(btn("tab"+(tab===t[0]?" on":""),t[1],function(){ tab=t[0]; render(); window.scrollTo(0,0); }));
  });
  var m=document.getElementById("main"); m.innerHTML=""; refresh=function(){};
  ({plan:renderPlan,income:renderIncome,bills:renderBills,life:renderLife,debt:renderDebt,data:renderData})[tab](m);
}

function renderPlan(m){
  var periods=buildPeriods();
  if(!periods.length){ m.appendChild(el("div","empty","Set your pay date and a baseline amount on the Income tab, and this fills in.")); return; }
  var C={bills:cssVar("--bills"),debt:cssVar("--debt"),life:cssVar("--life"),free:cssVar("--free"),short:cssVar("--short")};

  var hero=el("section","hero");
  var when=el("div","hero-when"), amt=el("div","hero-amt"), note=el("div","hero-note");
  var bar=el("div","bar"); bar.setAttribute("role","img"); bar.setAttribute("aria-label","Paycheck allocation");
  var legend=el("div","legend"), alarmSlot=el("div");
  [when,amt,note,bar,legend,alarmSlot].forEach(function(x){ hero.appendChild(x); });
  m.appendChild(hero);

  var detail=el("section","card"); detail.appendChild(el("h2",null,"What this check pays"));
  var detailBody=el("div"); detail.appendChild(detailBody); m.appendChild(detail);

  var tlCard=el("section","card");
  tlCard.appendChild(el("h2",null,"The next six months"));
  tlCard.appendChild(el("p","muted","Tap an amount to change what you expect that check to be."));
  var tl=el("div"); tlCard.appendChild(tl);
  tlCard.appendChild(el("p","muted foot","A dot marks a month with three paychecks — the bills stay the same, so that check is mostly yours."));
  m.appendChild(tlCard);

  var outCells=[];
  periods.forEach(function(p){
    var r=el("div","tl-row"), d=el("div","tl-date");
    d.appendChild(document.createTextNode(fmtShort(p.start)));
    if(p.thirdCheck){ var pip=el("span","pip"); pip.title="Third check this month"; d.appendChild(pip); }
    r.appendChild(d);
    var inWrap=el("div","tl-in");
    if(p.sources.length===1){
      var src=p.sources[0];
      var inc=state.incomes.filter(function(x){return x.id===src.incomeId;})[0];
      inWrap.appendChild(moneyInput(
        function(){ return state.overrides[src.key]!==undefined?num(state.overrides[src.key]):num(inc?inc.baseline:0); },
        function(v){ state.overrides[src.key]=v; },100));
    } else inWrap.appendChild(el("span","tl-multi",money0(p.income)));
    r.appendChild(inWrap);
    var out=el("div","tl-out"); r.appendChild(out); outCells.push(out);
    tl.appendChild(r);
  });

  var stand=el("section","card");
  stand.appendChild(el("h2",null,"Where you stand today"));
  stand.appendChild(row([el("label",null,"Checking"),moneyInput(function(){return num(state.checking);},function(v){state.checking=v;})]));
  stand.appendChild(row([el("label",null,"Savings"),moneyInput(function(){return num(state.savings);},function(v){state.savings=v;})]));
  var owedSlot=el("div"); stand.appendChild(owedSlot); m.appendChild(stand);

  refresh=function(){
    var ps=buildPeriods(); if(!ps.length) return;
    var n=ps[0], t=totals();
    when.textContent="Next paycheck · "+fmtDate(n.start);
    amt.textContent=money(n.income);
    note.textContent="Covers everything through "+fmtShort(addDays(n.end,-1));
    var segs=[{v:n.billTotal,c:C.bills},{v:n.debt,c:C.debt},{v:n.spend+n.save,c:C.life},
              {v:Math.max(0,n.free),c:C.free},{v:Math.max(0,-n.free),c:C.short}];
    var max=Math.max(n.income,segs.reduce(function(s,x){return s+x.v;},0),1);
    bar.innerHTML="";
    segs.forEach(function(s){ if(s.v>0){ var d=el("div","bar-seg"); d.style.width=(s.v/max*100)+"%"; d.style.background=s.c; bar.appendChild(d); } });
    legend.innerHTML="";
    [["Bills due",n.billTotal,C.bills],["Debt",n.debt,C.debt],["Life",n.spend+n.save,C.life],
     [n.free>=0?"Left over":"Short by",Math.abs(n.free),n.free>=0?C.free:C.short]].forEach(function(it){
      var w=el("div","legend-item"), dot=el("span","dot"); dot.style.background=it[2];
      w.appendChild(dot); w.appendChild(el("span","legend-label",it[0])); w.appendChild(el("span","legend-val",money0(it[1])));
      legend.appendChild(w);
    });
    alarmSlot.innerHTML="";
    if(n.free<0) alarmSlot.appendChild(el("div","alarm","This check runs "+money(-n.free)+" short. Trim a life category, move a bill, or lower the extra debt payment until it clears."));
    detailBody.innerHTML="";
    if(!n.bills.length) detailBody.appendChild(el("p","muted","No bills fall in this stretch."));
    n.bills.forEach(function(b){ detailBody.appendChild(lineRow(b.name,fmtShort(b.date),money(b.amount))); });
    detailBody.appendChild(lineRow("Debt payments","spread evenly",money(n.debt)));
    detailBody.appendChild(lineRow("Spending money","groceries, gas, fun",money(n.spend)));
    detailBody.appendChild(lineRow("Into savings pots","your savings goals",money(n.save)));
    detailBody.appendChild(lineRow(n.free>=0?"Unassigned":"Short","",money(n.free),n.free>=0?C.free:C.short,true));
    ps.forEach(function(p,i){
      if(!outCells[i]) return;
      outCells[i].textContent=(p.free>=0?"+":"")+money0(p.free);
      outCells[i].style.color=p.free>=0?C.free:C.short;
    });
    owedSlot.innerHTML="";
    owedSlot.appendChild(lineRow("Owed across all debts","",money(t.debtBal),C.debt,true));
  };
  refresh();
}

function renderIncome(m){
  var card=el("section","card");
  card.appendChild(el("h2",null,"Money coming in"));
  card.appendChild(el("p","muted","Set a baseline you can count on in a light pay period, not your best one. Every bill and fund below gets sized to fit that number, so a slow stretch never breaks the plan."));
  state.incomes.forEach(function(inc,idx){
    var b=el("div","block");
    b.appendChild(row([textInput(function(){return inc.name;},function(v){inc.name=v;})],
      idx>0?function(){ state.incomes=state.incomes.filter(function(x){return x.id!==inc.id;}); touched(); render(); }:null));
    b.appendChild(row([el("label",null,"Typical check"),moneyInput(function(){return num(inc.baseline);},function(v){inc.baseline=v;})]));
    b.appendChild(row([el("label",null,"A slow check"),moneyInput(function(){return num(inc.low);},function(v){inc.low=v;})]));
    var sel=document.createElement("select"); sel.className="sel";
    [["weekly","Every week"],["biweekly","Every 2 weeks"],["semimonthly","1st and 15th"],["monthly","Once a month"]].forEach(function(o){
      var op=document.createElement("option"); op.value=o[0]; op.textContent=o[1]; sel.appendChild(op);
    });
    sel.value=inc.cadence;
    sel.addEventListener("change",safe(function(){ inc.cadence=sel.value; refresh(); touched(); }));
    b.appendChild(row([el("label",null,"Paid"),sel]));
    var dt=document.createElement("input"); dt.type="date"; dt.className="date"; dt.value=inc.firstPayDate||"";
    dt.addEventListener("change",safe(function(){ inc.firstPayDate=dt.value; render(); touched(); }));
    b.appendChild(row([el("label",null,"Next pay date"),dt]));
    if(idx===0) b.appendChild(el("p","muted foot","Your pay dates set the rhythm for everything else."));
    card.appendChild(b);
  });
  card.appendChild(btn("add","Add another income",function(){
    state.incomes.push({id:uid(),name:"Second income",baseline:0,low:0,cadence:"biweekly",firstPayDate:toISO(addDays(new Date(),7))});
    touched(); render();
  }));
  m.appendChild(card);

  var test=el("section","card");
  test.appendChild(el("h2",null,"What one check has to cover"));
  var body=el("div"); test.appendChild(body);
  test.appendChild(el("p","muted foot","This updates as you type. If a number below goes red, the fix isn't willpower — it's a smaller monthly commitment somewhere."));
  m.appendChild(test);

  refresh=function(){
    body.innerHTML="";
    var inc=state.incomes[0], t=totals();
    var committed=(t.bills+t.debtMin+num(state.extraDebtMonthly)+t.spend+t.save)*PER_CHECK;
    var GREEN=cssVar("--free"), RED=cssVar("--short");
    var typical=num(inc?inc.baseline:0), low=num(inc?inc.low:0);
    body.appendChild(lineRow("A typical check","",money(typical)));
    body.appendChild(lineRow("Committed per check","bills, debt, life",money(committed)));
    var gapT=typical-committed;
    body.appendChild(lineRow(gapT>=0?"Left over":"Short by","",money(Math.abs(gapT)),gapT>=0?GREEN:RED,true));
    if(low>0){
      var gapL=low-committed;
      body.appendChild(el("h3",null,"If every check came in slow"));
      body.appendChild(el("p","muted","Testing against "+money(low)+" instead of "+money(typical)+"."));
      body.appendChild(lineRow(gapL>=0?"Still clears, with":"Comes up short by","",money(Math.abs(gapL)),
        gapL>=0?GREEN:RED,true));
    }
  };
  refresh();
}

function renderBills(m){
  var card=el("section","card");
  card.appendChild(el("h2",null,"Bills that show up every month"));
  card.appendChild(el("p","muted","Same amount, same date, no decision to make. Anything that hits once a year — registration, insurance in full, holidays — belongs on the Life tab as something you save toward instead."));
  var hdr=el("div","hdr");
  hdr.appendChild(el("span",null,"Bill")); hdr.appendChild(el("span","r","Amount")); hdr.appendChild(el("span","r","Due"));
  card.appendChild(hdr);
  state.bills.forEach(function(b){
    var day=document.createElement("input"); day.className="day"; day.setAttribute("inputmode","numeric"); day.value=b.dueDay;
    day.addEventListener("input",safe(function(){ b.dueDay=Math.min(31,Math.max(1,num(day.value)||1)); refresh(); touched(); }));
    card.appendChild(row([textInput(function(){return b.name;},function(v){b.name=v;}),
      moneyInput(function(){return num(b.amount);},function(v){b.amount=v;},100),day],

  var slot=el("div"); card.appendChild(slot); m.appendChild(card);
  refresh=function(){
    var t=totals(); slot.innerHTML="";
    slot.appendChild(lineRow("Every month",money(t.bills*PER_CHECK)+" a check",money(t.bills),null,true));

  refresh();
}

function renderLife(m){
  var card=el("section","card");
  card.appendChild(el("h2",null,"The reason you're doing this"));
  card.appendChild(el("p","muted","Two kinds of money here. Spending refills every paycheck and is gone when it's gone. Saving up piles toward something — a trip, a pair of shoes you actually want, the car repair you can't predict."));
  card.appendChild(el("h3",null,"Spending each check"));
  var perCells=[];
  var spendItems=state.life.filter(function(l){return l.kind!=="save";});
  if(!spendItems.length) card.appendChild(el("p","muted","Nothing here yet."));
  spendItems.forEach(function(l){
    var per=el("span","per"); perCells.push({el:per,item:l});
    card.appendChild(row([textInput(function(){return l.name;},function(v){l.name=v;}),
      moneyInput(function(){return num(l.monthly);},function(v){l.monthly=v;},100),per],
      function(){ state.life=state.life.filter(function(x){return x.id!==l.id;}); touched(); render(); }));
  });
  card.appendChild(btn("add","Add spending money",function(){
    state.life.push({id:uid(),name:"New category",kind:"spend",monthly:0}); touched(); render(); }));

  card.appendChild(el("h3",null,"Saving up for"));
  var pots=[];
  state.life.filter(function(l){return l.kind==="save";}).forEach(function(l){
    var wrap=el("div","pot"), per=el("span","per");
    wrap.appendChild(row([textInput(function(){return l.name;},function(v){l.name=v;}),
      moneyInput(function(){return num(l.monthly);},function(v){l.monthly=v;},100),per],
      function(){ state.life=state.life.filter(function(x){return x.id!==l.id;}); touched(); render(); }));
    var meta=el("div","pot-meta");
    meta.appendChild(el("span","pot-lab","Goal"));
    meta.appendChild(moneyInput(function(){return num(l.target);},function(v){l.target=v;},92));
    meta.appendChild(el("span","pot-lab","Saved"));
    meta.appendChild(moneyInput(function(){return num(l.saved);},function(v){l.saved=v;},92));
    wrap.appendChild(meta);
    var prog=el("div","prog"), fill=el("div","prog-fill"), note=el("div","pot-note");
    prog.appendChild(fill); wrap.appendChild(prog); wrap.appendChild(note);
    card.appendChild(wrap);
    pots.push({item:l,per:per,prog:prog,fill:fill,note:note});
  });
  card.appendChild(btn("add","Add something to save for",function(){
    state.life.push({id:uid(),name:"New goal",kind:"save",monthly:0,target:0,saved:0}); touched(); render(); }));
  var slot=el("div"); card.appendChild(slot); m.appendChild(card);

  refresh=function(){
    perCells.forEach(function(c){ c.el.textContent=money0(num(c.item.monthly)*PER_CHECK); });
    pots.forEach(function(p){
      var l=p.item, perCheck=num(l.monthly)*PER_CHECK;
      p.per.textContent=money0(perCheck);
      var target=num(l.target), saved=num(l.saved), remaining=Math.max(0,target-saved);
      if(target>0){
        p.prog.style.display=""; p.note.style.display="";
        p.fill.style.width=Math.min(100,(saved/target)*100)+"%";
        if(remaining<=0) p.note.textContent="Funded. Go spend it.";
        else if(perCheck>0){ var c=Math.ceil(remaining/perCheck);
          p.note.textContent=money0(remaining)+" to go — about "+c+" paycheck"+(c===1?"":"s")+"."; }
        else p.note.textContent=money0(remaining)+" to go. Set a monthly amount to see how long.";
      } else { p.prog.style.display="none"; p.note.style.display="none"; }
    });
    var t=totals(); slot.innerHTML="";
    slot.appendChild(lineRow("Life, every month",money((t.spend+t.save)*PER_CHECK)+" a check",money(t.spend+t.save),null,true));
  };
  refresh();
}

function renderDebt(m){
  var owe=el("section","card");
  owe.appendChild(el("h2",null,"What you owe"));
  var hdr=el("div","hdr");
  hdr.appendChild(el("span",null,"Debt")); hdr.appendChild(el("span","r","Balance"));
  hdr.appendChild(el("span","r","APR")); hdr.appendChild(el("span","r","Min"));
  owe.appendChild(hdr);
  state.debts.forEach(function(d){
    var pct=el("div","pct"), pi=document.createElement("input");
    pi.setAttribute("inputmode","decimal"); pi.value=d.apr;
    pi.addEventListener("input",safe(function(){ d.apr=num(pi.value); refresh(); touched(); }));
    pct.appendChild(pi); pct.appendChild(el("span","pct-sign","%"));
    owe.appendChild(row([textInput(function(){return d.name;},function(v){d.name=v;}),
      moneyInput(function(){return num(d.balance);},function(v){d.balance=v;},104),pct,
      moneyInput(function(){return num(d.minimum);},function(v){d.minimum=v;},84)],
      function(){ state.debts=state.debts.filter(function(x){return x.id!==d.id;}); touched(); render(); }));
  });
  owe.appendChild(btn("add","Add a debt",function(){
    state.debts.push({id:uid(),name:"New debt",balance:0,apr:0,minimum:0}); touched(); render(); }));
  m.appendChild(owe);

  var push=el("section","card");
  push.appendChild(el("h2",null,"Push harder"));
  push.appendChild(row([el("label",null,"Extra each month"),
    moneyInput(function(){return num(state.extraDebtMonthly);},function(v){state.extraDebtMonthly=v;})]));
  var seg=el("div","seg");
  var bA=btn("seg-btn"+(state.strategy==="avalanche"?" on":""),"Highest rate first",function(){ state.strategy="avalanche"; touched(); render(); });
  var bS=btn("seg-btn"+(state.strategy==="snowball"?" on":""),"Smallest balance first",function(){ state.strategy="snowball"; touched(); render(); });
  seg.appendChild(bA); seg.appendChild(bS); push.appendChild(seg);
  push.appendChild(el("p","muted",state.strategy==="avalanche"
    ? "Costs you the least. Whatever carries the highest rate goes first."
    : "Costs a bit more in interest, but you clear a whole debt sooner — which is the thing that actually keeps people going."));
  var slot=el("div"); push.appendChild(slot); m.appendChild(push);

  refresh=function(){
    slot.innerHTML="";
    var extra=num(state.extraDebtMonthly);
    var plan=simulate(extra,state.strategy), minOnly=simulate(0,state.strategy);
    if(!plan){ slot.appendChild(el("div","empty","Put in a balance and a minimum to see how this ends.")); return; }
    if(plan.stalled){ slot.appendChild(el("div","alarm","At these minimums the balances never clear — the interest outruns the payments. Even a small extra amount changes that.")); return; }
    var res=el("div","result"), big=el("div","result-big");
    big.appendChild(document.createTextNode(Math.floor(plan.months/12)));
    big.appendChild(el("span","unit","y"));
    big.appendChild(document.createTextNode(plan.months%12));
    big.appendChild(el("span","unit","m"));
    res.appendChild(big);
    res.appendChild(el("div","result-note","Debt free around "+monthYear(plan.months)));
    slot.appendChild(res);
    slot.appendChild(lineRow("Interest you'll pay","",money(plan.interest)));
    if(minOnly && !minOnly.stalled && extra>0)
      slot.appendChild(lineRow("Saved by paying extra",(minOnly.months-plan.months)+" months sooner",
        money(minOnly.interest-plan.interest),cssVar("--free")));
    slot.appendChild(el("h3",null,"Order they fall"));
    state.debts.filter(function(d){return num(d.balance)>0;})
      .sort(function(a,b){ return (plan.payoff[a.id]||999)-(plan.payoff[b.id]||999); })
      .forEach(function(d){
        slot.appendChild(lineRow(d.name, plan.payoff[d.id]?monthShort(plan.payoff[d.id]):"—", money(num(d.balance))));
      });
  };
  refresh();
}

function renderData(m){
  var s=el("section","card");
  s.appendChild(el("h2",null,"Where your numbers live"));
  if(store==="cloud") s.appendChild(el("p","muted","Synced to your shared household budget and mirrored on this phone. Either of you can open it anywhere and see the same numbers. The mirror means it still works with no signal — it catches up when you're back online."));
  else if(store==="db") s.appendChild(el("p","muted","Saved to your Claude account and mirrored on this device. Open the page anywhere you're signed in and your numbers follow."));
  else if(store==="local") s.appendChild(el("p","muted","Saved in this browser, on this device only. Nothing leaves the device — which also means nothing follows you to another one. Back up before you clear browsing data or change phones."));
  else { var a=el("div","alarm","This browser is blocking storage, so nothing is being saved. Anything you type is lost when you close the page. Back up to a file before you go, or open the page from a different browser."); s.appendChild(a); }
  m.appendChild(s);

  if(cloud){
    var acc=el("section","card");
    acc.appendChild(el("h2",null,"Account"));
    acc.appendChild(el("p","muted","Signed in as "+cloud.email+". You both write to the same budget, and a change on one phone shows up on the other within a second or two. If you're both typing in the same field at once, the last save wins."));
    acc.appendChild(btn("action","Sign out",function(){ cloud.signOut(); }));
    m.appendChild(acc);
  }

  var f=el("section","card");
  f.appendChild(el("h2",null,"Files"));
  f.appendChild(el("p","muted","Back up every few paychecks. It's a small text file and it's the only copy that can't be wiped by a browser."));
  f.appendChild(btn("action","Export to Excel",doExport));
  f.appendChild(btn("action","Back up to a file",doBackup));
  var pick=document.createElement("input");
  pick.type="file"; pick.accept=".json,application/json"; pick.style.display="none";
  pick.addEventListener("change",function(){ if(pick.files&&pick.files[0]) doRestore(pick.files[0]); pick.value=""; });
  f.appendChild(btn("action","Restore from a backup",function(){ pick.click(); }));
  f.appendChild(pick);
  f.appendChild(el("p","muted foot","Excel export needs a connection the first time; everything else works offline."));
  m.appendChild(f);

  if(errors.length){
    var e=el("section","card");
    e.appendChild(el("h2",null,"Problems this session"));
    e.appendChild(el("p","muted","If something looked wrong, this is what the page recorded. Send it over and it'll tell me exactly what broke."));
    errors.forEach(function(x){
      var d=el("div","errline",x); e.appendChild(d);
    });
    m.appendChild(e);
  }

  var q=el("section","card quiet");
  q.appendChild(btn("reset","Clear everything and start over",function(){
    if(confirm("Clear every number and start over? This can't be undone.")){ state=seed(); touched(); flush(); render(); }
  }));
  q.appendChild(el("div","build","Build "+BUILD));
  m.appendChild(q);
}

initStorage();
})();
</script>

<script type="module">
/* Optional shared-household layer. Inert unless FIREBASE_CONFIG is filled in. */
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.projectId) {
  const V = "12.17.1";
  const cdn = "https://www.gstatic.com/firebasejs/" + V + "/";
  try {
    const [core, auth, fs] = await Promise.all([
      import(cdn + "firebase-app.js"),
      import(cdn + "firebase-auth.js"),
      import(cdn + "firebase-firestore.js")
    ]);

    const app = core.initializeApp(cfg);
    const a = auth.getAuth(app);
    await auth.setPersistence(a, auth.browserLocalPersistence);

    let db;
    try {
      db = fs.initializeFirestore(app, {
        localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
      });
    } catch (e) {
      db = fs.getFirestore(app);   // private browsing blocks the cache; memory is fine
    }
    const ref = fs.doc(db, "budgets", "household");

    const friendly = (code) => ({
      "auth/invalid-email": "That doesn't look like an email address.",
      "auth/invalid-credential": "Wrong email or password.",
      "auth/wrong-password": "Wrong email or password.",
      "auth/user-not-found": "No account for that email. It has to be created in the Firebase console first.",
      "auth/too-many-requests": "Too many tries. Wait a minute and try again.",
      "auth/network-request-failed": "No connection. Try again when you're back online."
    })[code] || ("Sign-in failed (" + code + ").");

    const promptSignIn = (err) => {
      window.Ledger.askSignIn(async (email, pass) => {
        try { await auth.signInWithEmailAndPassword(a, email, pass); }
        catch (e) { promptSignIn(friendly(e.code)); }
      }, err);
    };

    let unsub = null;
    auth.onAuthStateChanged(a, (user) => {
      if (unsub) { unsub(); unsub = null; }
      if (!user) { window.Ledger.detach(); promptSignIn(""); return; }

      let seeded = false;
      unsub = fs.onSnapshot(ref,
        (snap) => {
          if (snap.metadata.hasPendingWrites) return;   // our own write echoing back
          if (snap.exists()) { window.Ledger.applyRemote(snap.data()); seeded = true; }
          else if (!seeded) { seeded = true; fs.setDoc(ref, window.Ledger.getState()); }
        },
        (e) => window.Ledger.status("Sync error: " + e.code, true)
      );

      window.Ledger.attach({
        email: user.email,
        save: (obj) => fs.setDoc(ref, obj)
          .then(() => window.Ledger.status("Synced"))
          .catch((e) => window.Ledger.status("Not synced (" + e.code + ")", true)),
        signOut: () => auth.signOut(a)
      });
    });
  } catch (e) {
    window.Ledger.failed("Cloud sync unavailable: " + (e && e.message ? e.message : e));
  }
}
</script>
